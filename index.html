<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Сломанный сигнал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@600;700;800&family=Unbounded:wght@600;700;800&display=swap">
<style>
/* Палата-лаборатория на проекторе: слева монитор пациента, в центре схема клетки — сцена расследования,
   справа анализы-улики, внизу штабы. Ночной режим — основной (тёмный, неоновый), дневной — для светлого класса. */
:root{
  --bg:#070B15; --bg-hi1:rgba(46,230,214,.075); --bg-hi2:rgba(255,62,122,.065); --grid:rgba(130,170,230,.045);
  --panel:#0D1426; --panel-2:#121B31; --panel-3:#19243F; --line:#212E4A; --line-2:#30416A;
  --ink:#EAF0FF; --ink-2:#BFCAE3; --muted:#8190B2;
  --signal:#2EE6D6; --signal-a:rgba(46,230,214,.22);
  --alarm:#FF3E7A; --alarm-a:rgba(255,62,122,.2);
  --gold:#FFD25A; --gold-a:rgba(255,210,90,.24); --gold-ink:#2A1E00;
  --ok:#3DF59B; --ok-a:rgba(61,245,155,.16);
  --up:#FFB547; --down:#62B4FF; --norm:#3DF59B; --found:#E58BFF; --info:#8190B2;
  --t0:#3F86F0; --t1:#FF8F4D; --t2:#D2A6FF;
  --t0a:rgba(63,134,240,.22); --t1a:rgba(255,143,77,.2); --t2a:rgba(210,166,255,.2);
  --node:#0F1930; --node-line:#2B3B60; --mem-head:#31466F; --mem-tail:#1B2846; --zone:#5D6E95;
  --z-out:rgba(255,193,77,.035); --paper:#111829; --paper-ink:#DCE5F7; --redact:#02040A; --motif:rgba(134,168,255,.072); --motif-strong:rgba(134,168,255,.16); --nuc:#0F1931; --nuc-line:#34497A; --er:#0D1A2C; --er-line:#2C4D63;
  --k-lig:#FFC14D; --k-rec:#2EE6D6; --k-prot:#86A8FF; --k-msg:#3DF59B; --k-eff:#E58BFF; --k-gene:#C08CFF; --k-lig-a:rgba(255,193,77,.2); --k-rec-a:rgba(46,230,214,.2); --k-prot-a:rgba(134,168,255,.2); --k-msg-a:rgba(61,245,155,.2); --k-eff-a:rgba(229,139,255,.18); --k-gene-a:rgba(192,140,255,.2); --k-ab:#FF6FB5;
  --mon-bg:#02060C; --mon-grid:rgba(61,245,155,.075); --mon-ink:#3DF59B; --mon-dim:#5C7A70;
  --veil:rgba(3,6,13,.82); --shadow:rgba(0,0,0,.55);
  --btn:#152038; --btn-hi:#1D2B4B; --primary:#2EE6D6; --primary-ink:#021514;
  --f-display:'Unbounded','Nunito',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
:root[data-look="day"]{
  --bg:#ECF1F8; --bg-hi1:rgba(10,158,153,.07); --bg-hi2:rgba(220,31,90,.045); --grid:rgba(40,70,120,.05);
  --panel:#FFFFFF; --panel-2:#F4F7FC; --panel-3:#E8EEF8; --line:#D3DCEA; --line-2:#B5C3D9;
  --ink:#0F1A2E; --ink-2:#33415C; --muted:#5A6782;
  --signal:#087F7B; --signal-a:rgba(8,127,123,.16);
  --alarm:#D81E58; --alarm-a:rgba(216,30,88,.13);
  --gold:#8A5F00; --gold-a:rgba(138,95,0,.13); --gold-ink:#FFFFFF;
  --ok:#0B7F4F; --ok-a:rgba(11,127,79,.12);
  --up:#C06C00; --down:#1F6FD1; --norm:#0E9F62; --found:#A03CC6; --info:#5A6782;
  --t0:#1E5BC6; --t1:#C4541A; --t2:#8A4BEA;
  --t0a:rgba(30,91,198,.13); --t1a:rgba(196,84,26,.13); --t2a:rgba(138,75,234,.13);
  --node:#FFFFFF; --node-line:#B7C4DA; --mem-head:#AFBDD6; --mem-tail:#D6DEEC; --zone:#7987A5;
  --z-out:rgba(194,127,0,.045); --paper:#FFFDF7; --paper-ink:#1C2333; --redact:#0F1A2E; --motif:rgba(59,111,216,.075); --motif-strong:rgba(59,111,216,.16); --nuc:#F3F6FC; --nuc-line:#A9B8D3; --er:#EDF6F7; --er-line:#98C1C8;
  --k-lig:#C27F00; --k-rec:#0A9E99; --k-prot:#3B6FD8; --k-msg:#0E9F62; --k-eff:#A03CC6; --k-gene:#7A45E0; --k-lig-a:rgba(194,127,0,.14); --k-rec-a:rgba(10,158,153,.14); --k-prot-a:rgba(59,111,216,.13); --k-msg-a:rgba(14,159,98,.13); --k-eff-a:rgba(160,60,198,.12); --k-gene-a:rgba(122,69,224,.13); --k-ab:#C2367F;
  --veil:rgba(236,241,248,.86); --shadow:rgba(20,35,70,.16);
  --btn:#F1F5FB; --btn-hi:#E3EAF5; --primary:#0F1A2E; --primary-ink:#FFFFFF;
  color-scheme:light;
}
html,body{height:100%}
html{font-size:calc(clamp(13px,.92vw,21px) * var(--ui,1))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:600;line-height:1.35;overflow:hidden;
  background-image:radial-gradient(60rem 40rem at 8% -10%,var(--bg-hi1),transparent 70%),radial-gradient(50rem 36rem at 105% 110%,var(--bg-hi2),transparent 70%),
  linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:auto,auto,2.2rem 2.2rem,2.2rem 2.2rem}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.lbl{font-family:var(--f-display);font-size:.62rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ico{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tcol0{--tc:var(--t0);--tca:var(--t0a)} .tcol1{--tc:var(--t1);--tca:var(--t1a)} .tcol2{--tc:var(--t2);--tca:var(--t2a)}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:.7rem;padding-block:.65rem;padding-inline:16px}
#app[hidden]{display:none}

/* ===== кнопки ===== */
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem .95rem;border-radius:12px;border:1px solid var(--line-2);background:var(--btn);cursor:pointer;font-weight:800;line-height:1.2;text-align:left;transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){background:var(--btn-hi);border-color:var(--ink-2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.ver:focus-visible,.test:focus-visible,.opt:focus-visible,.chip-btn:focus-visible,.case-card:focus-visible,.rtabs button:focus-visible,.deb-nav button:focus-visible,.at-list li:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);box-shadow:0 0 0 0 var(--signal-a)}
.btn.primary:hover:not(:disabled){background:var(--primary);filter:brightness(1.08);box-shadow:0 0 1.4rem var(--signal-a)}
.btn.big{font-size:1.12rem;padding:.8rem 1.35rem;border-radius:14px}
.btn.sm{font-size:.8rem;padding:.38rem .7rem;border-radius:10px}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--alarm);color:var(--alarm)}
.btn .kbd{font-family:var(--f-mono);font-size:.62rem;border:1px solid currentColor;border-radius:5px;padding:.05rem .32rem;opacity:.65;font-weight:700}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.sp{flex:1}

/* ===== шапка ===== */
.top{display:flex;align-items:center;gap:.6rem 1.4rem;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:.65rem;font-family:var(--f-display);font-weight:700;letter-spacing:.06em;font-size:1.02rem;white-space:nowrap}
.brand svg{width:2.4rem;height:1.2rem;overflow:visible}
.brand svg path{fill:none;stroke:var(--alarm);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;animation:blip 2.4s linear infinite}
@keyframes blip{0%{stroke-dashoffset:60}60%,100%{stroke-dashoffset:-60}}
.crumb{display:flex;align-items:center;gap:.8rem;min-width:0}
.crumb .num{font-family:var(--f-mono);font-weight:800;font-size:.95rem;padding:.25rem .6rem;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.crumb .ttl{font-weight:800;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.18rem .5rem;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.tag.practice{border-color:var(--gold);color:var(--gold)}
.dots{display:flex;gap:.3rem;align-items:center}
.dot{width:.72rem;height:.72rem;border-radius:3px;border:1.5px solid var(--line-2);background:transparent}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.lost{background:var(--alarm);border-color:var(--alarm)}
.dot.now{border-color:var(--signal);box-shadow:0 0 .6rem var(--signal-a);animation:breathe 1.6s ease-in-out infinite}
.dot.fin{border-radius:50%}
.right{margin-left:auto;display:flex;align-items:center;gap:.5rem 1rem;flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-size:1.05rem;font-weight:700;color:var(--ink-2);display:flex;gap:.45rem;align-items:center}
.paused-chip{font-family:var(--f-display);font-size:.62rem;letter-spacing:.12em;background:var(--alarm);color:#fff;padding:.25rem .55rem;border-radius:999px;animation:breathe 1.2s ease-in-out infinite}

/* ===== сцена ===== */
.stage{display:grid;grid-template-columns:minmax(15rem,20fr) minmax(0,56fr) minmax(17rem,24fr);gap:.75rem;min-height:0}
.colm{display:flex;flex-direction:column;gap:.7rem;min-height:0;min-width:0}
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:18px;position:relative}
.pnl-h{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;padding:.75rem 1rem .2rem}

/* монитор */
.mon{background:var(--mon-bg);border:1px solid #13202A;border-radius:18px;position:relative;overflow:hidden;height:11.5rem;flex:none;
  background-image:linear-gradient(var(--mon-grid) 1px,transparent 1px),linear-gradient(90deg,var(--mon-grid) 1px,transparent 1px);background-size:1.1rem 1.1rem;
  box-shadow:inset 0 0 3rem rgba(0,0,0,.8)}
.mon canvas{position:absolute;inset:0;width:100%;height:100%}
.mon .m-top{position:absolute;left:.85rem;top:.6rem;right:.85rem;display:flex;justify-content:space-between;gap:.5rem;font-family:var(--f-mono);font-size:.68rem;color:var(--mon-dim);letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.mon .m-read{position:absolute;right:.85rem;bottom:.55rem;text-align:right;font-family:var(--f-mono);pointer-events:none}
.mon .m-hr{font-size:2.6rem;font-weight:800;line-height:1;color:var(--mc,#3DF59B);text-shadow:0 0 1rem var(--mc,#3DF59B)}
.mon .m-hr small{font-size:.75rem;margin-left:.25rem;opacity:.75}
.mon .m-sub{font-size:.78rem;color:var(--mon-dim);margin-top:.25rem}
.mon .m-sub b{color:#7FD6FF;font-weight:800}
.mon .heart{display:inline-block;color:var(--mc,#3DF59B);transition:transform .08s}
.mon .heart.beat{transform:scale(1.35)}
.mon.alarm{animation:alarmframe 1s ease-in-out infinite}
.mon.flat .m-hr{color:#FF3E7A;text-shadow:0 0 1rem #FF3E7A}
@keyframes alarmframe{0%,100%{box-shadow:inset 0 0 3rem rgba(0,0,0,.8),0 0 0 0 rgba(255,62,122,0)}50%{box-shadow:inset 0 0 3rem rgba(255,62,122,.18),0 0 0 3px rgba(255,62,122,.7)}}
.mon.hit{animation:hit .5s ease}
@keyframes hit{0%{filter:none}30%{filter:brightness(1.6) saturate(1.4)}100%{filter:none}}

/* состояние */
.hp{padding:.7rem 1rem .8rem;display:grid;gap:.45rem;flex:none}
.hp-top{display:flex;justify-content:space-between;align-items:baseline}
.hp-n{font-family:var(--f-mono);font-weight:800;font-size:1.25rem}
.hp-bar{display:grid;grid-template-columns:repeat(var(--n,6),1fr);gap:.3rem}
.seg{height:1.15rem;border-radius:5px;background:var(--hc,var(--ok));box-shadow:0 0 .8rem var(--hca,var(--ok-a));transition:background .3s}
.seg.off{background:var(--panel-3);box-shadow:none}
.seg.lose{animation:segout .7s ease forwards}
@keyframes segout{0%{transform:scaleY(1);background:var(--alarm)}40%{transform:scaleY(1.5);background:var(--alarm)}100%{transform:scaleY(1);background:var(--panel-3);box-shadow:none}}
.hp.mid{--hc:var(--up);--hca:rgba(255,181,71,.22)}
.hp.low{--hc:var(--alarm);--hca:var(--alarm-a)}
.hp-note{font-size:.74rem;color:var(--muted)}

/* пациент */
.pcard{padding:.85rem 1rem 1rem;display:flex;flex-direction:column;gap:.65rem;overflow:auto;min-height:0;flex:1}
.who{display:flex;gap:.75rem;align-items:center}
.ava{width:2.9rem;height:2.9rem;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:700;font-size:1.05rem;color:var(--ink);background:var(--panel-3);border:1.5px solid var(--line-2)}
.ava svg{width:1.6rem;height:1.6rem}
.who h3{font-family:var(--f-display);font-size:1.05rem;font-weight:700;letter-spacing:.01em}
.who .meta{font-size:.82rem;color:var(--muted);margin-top:.15rem}
.complaint{font-size:1rem;font-weight:700;line-height:1.38;color:var(--ink)}
.facts{display:grid;gap:.35rem;margin:0;padding:0;list-style:none}
.facts li{display:flex;gap:.5rem;align-items:flex-start;font-size:.86rem;color:var(--ink-2);padding:.4rem .55rem;border-radius:9px;background:var(--panel-2);border:1px solid var(--line)}
.facts li::before{content:'';width:.42rem;height:.42rem;border-radius:50%;background:var(--signal);margin-top:.42rem;flex:none}

/* схема */
.cx{display:flex;flex-direction:column;min-height:0;gap:.7rem}
.diap{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.diap .pnl-h{padding-bottom:0}
.q-big{font-family:var(--f-display);font-weight:700;font-size:1.02rem}
.diabox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:.2rem .6rem .5rem}
.dia{width:100%;height:100%;display:block;max-height:100%}
.dia text{font-family:var(--f-body)}
.z-top{fill:transparent}
.zl{font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.16em;fill:var(--zone)}
.mem-h{fill:var(--mem-head)} .mem-t{stroke:var(--mem-tail);stroke-width:2}
.nucl{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:2}
.nucl2{fill:none;stroke:var(--nuc-line);stroke-width:1.2;opacity:.55}
.erz{fill:var(--er);stroke:var(--er-line);stroke-width:2;stroke-dasharray:10 6}
.divl{stroke:var(--line-2);stroke-width:2;stroke-dasharray:6 8}
.ed{stroke:var(--line-2);stroke-width:3;fill:none;stroke-linecap:round;transition:stroke .4s,opacity .4s}
.ed.dif,.ed.mov{stroke-dasharray:7 7}
.ed.inh{stroke:var(--muted);stroke-dasharray:3 6}
.ah{fill:var(--line-2);transition:fill .4s,opacity .4s}
.tb{stroke:var(--muted);stroke-width:4;stroke-linecap:round}
.nd{--kc:var(--node-line);--kcf:transparent;transition:opacity .4s}
.nd.k-lig{--kc:var(--k-lig);--kcf:var(--k-lig-a)} .nd.k-rec{--kc:var(--k-rec);--kcf:var(--k-rec-a)} .nd.k-prot{--kc:var(--k-prot);--kcf:var(--k-prot-a)} .nd.k-msg{--kc:var(--k-msg);--kcf:var(--k-msg-a)} .nd.k-eff{--kc:var(--k-eff);--kcf:var(--k-eff-a)} .nd.k-gene{--kc:var(--k-gene);--kcf:var(--k-gene-a)}
.nd .b{fill:var(--node);stroke:var(--kc);stroke-width:2.2}
.nd.k-rec .b{stroke-width:2.5}
.nd .h{fill:var(--kcf);stroke:var(--kc);stroke-width:1.6}
.nd .l{fill:none;stroke:var(--kc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nd .l.thin{stroke-width:1.2}
.nd .l.dash,.nd .ic.dash{stroke-dasharray:3 3}
.nd .l.anchor{stroke-dasharray:2 2}
.nd .k{fill:none;stroke:var(--kc);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.nd .k.tm{stroke-width:4}
.nd .k.ab{stroke:var(--k-ab);stroke-width:7}
.nd .k.hsp{stroke:var(--muted);stroke-width:5;opacity:.75}
.nd .k.lrr{stroke-width:9;opacity:.9}
.nd .f{fill:var(--kc);stroke:none}
.nd .f.itam{fill:var(--k-ab)}
.nd .zf{fill:var(--node);stroke:var(--kc);stroke-width:1.6}
.nd .back{opacity:.45}
.nd .back2{fill:var(--kcf)}
.nd .eff{stroke-dasharray:6 5}
.nd .pl{fill:var(--node);stroke:var(--kc);stroke-width:1.4}
.nd text{fill:var(--ink);font-weight:800;text-anchor:middle;dominant-baseline:central}
.nd .tx{font-size:19px}
.nd .pt{font-size:16px}
.nd .gk{font-size:12.5px;fill:var(--kc);font-weight:900}
.nd .tiny{font-size:12px;fill:var(--muted);font-weight:800;letter-spacing:.06em}
.nd .ict{font-size:6px;fill:var(--kc)}
.nd .ic{fill:none;stroke:var(--kc);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nd .icf{fill:var(--kc);stroke:none}
.nd .dna{stroke-width:1.6}
.part{fill:var(--signal)}
.part.flood{fill:var(--alarm)}
.part.lit{fill:var(--signal)}
.pin{cursor:default}
.pin .pc{fill:var(--alarm);stroke:var(--panel);stroke-width:3}
.pin text{fill:#fff;font-family:var(--f-display);font-weight:700;font-size:15px;text-anchor:middle;dominant-baseline:central}
.pin .halo{fill:none;stroke:var(--alarm);stroke-width:2;opacity:.0}
.clickable .pin{cursor:pointer}
.clickable .pin:hover .pc{stroke:var(--ink);stroke-width:3.5}
.pin.wrong .pc{fill:var(--panel-3);stroke:var(--wc,var(--muted))}
.pin.wrong text{fill:var(--muted)}
.pin.right .pc{fill:var(--gold);stroke:var(--panel)}
.pin.right text{fill:var(--gold-ink)}
.pin.right .halo{stroke:var(--gold);opacity:1;transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}
.pin .x{stroke:var(--wc,var(--muted));stroke-width:3;stroke-linecap:round}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
/* вскрытие */
.reveal .nd.dim{opacity:.28}
.reveal .ed.dim,.reveal .ah.dim{opacity:.22}
.reveal .nd.lit{--kc:var(--signal)}
.reveal .ed.lit{stroke:var(--signal);opacity:1}
.reveal .ah.lit{fill:var(--signal)}
.reveal .nd.brk{--kc:var(--alarm);--kcf:var(--alarm-a)}
.reveal .nd.brk{filter:drop-shadow(0 0 10px var(--alarm))}
.reveal .nd.flood{--kc:var(--alarm)}
.reveal .ed.flood{stroke:var(--alarm);opacity:1}
.reveal .ah.flood{fill:var(--alarm)}
.reveal .ed.brk{stroke:var(--alarm);stroke-width:4}
.reveal .nd.good{--kc:var(--gold);--kcf:var(--gold-a)}
.crack{stroke:var(--alarm);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:120;stroke-dashoffset:120;animation:draw .7s .3s ease forwards}
.brktag rect{fill:var(--alarm)} .brktag text{fill:#fff;font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.06em;text-anchor:middle;dominant-baseline:central}
.brktag.gold rect{fill:var(--gold)} .brktag.gold text{fill:var(--gold-ink)}
.brktag{animation:popin .5s .5s cubic-bezier(.2,1.5,.4,1) both;transform-box:fill-box;transform-origin:center}
.brkpulse{fill:none;stroke:var(--alarm);stroke-width:3;transform-box:fill-box;transform-origin:center;opacity:0;animation:ring2 1.5s ease-out 4}
@keyframes ring2{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.14)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes popin{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:none}}

/* версии */
.versp{flex:none;padding:.75rem .85rem .85rem}
.vers{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;justify-items:stretch}
.ver{width:100%;display:flex;gap:.65rem;align-items:center;text-align:left;padding:.5rem .7rem .5rem .5rem;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);min-height:3.05rem;cursor:default;font-weight:700;font-size:.92rem;line-height:1.25;transition:border-color .15s,background .15s,opacity .2s}
.clickable .ver{cursor:pointer}
.clickable .ver:hover{border-color:var(--tc,var(--ink-2));background:var(--panel-3)}
.ver .vn{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:700;font-size:.9rem;background:var(--alarm);color:#fff}
.ver .vt{flex:1;min-width:0}
.ver.wrong{opacity:.55}
.ver.wrong .vt{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--wc,var(--muted))}
.ver.wrong .vn{background:var(--panel-3);color:var(--muted)}
.ver .who-chip{font-size:.66rem;font-weight:800;padding:.14rem .45rem;border-radius:999px;border:1.5px solid var(--tc);color:var(--tc);white-space:nowrap}
.ver.right{border-color:var(--gold);background:var(--gold-a)}
.ver.right .vn{background:var(--gold);color:var(--gold-ink)}

/* анализы */
.rx{display:flex;flex-direction:column;min-height:0}
.testsp{flex:1;min-height:0;display:flex;flex-direction:column}
.tests{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(6.4rem,1fr);gap:.5rem;padding:.6rem .85rem .85rem}
.test{position:relative;perspective:900px;border:0;padding:0;background:transparent;text-align:left;cursor:default;min-height:6.4rem}
.clickable .test.closed{cursor:pointer}
.test .face{position:absolute;inset:0;border-radius:14px;padding:.6rem .7rem;display:flex;flex-direction:column;gap:.35rem;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .6s cubic-bezier(.3,.7,.2,1);overflow:hidden}
.test .front{background:var(--panel-2);border:1px solid var(--line)}
.test .back{background:var(--panel-3);border:1.5px solid var(--tc,var(--line-2));transform:rotateY(180deg)}
.test.open .front{transform:rotateY(-180deg)}
.test.open .back{transform:rotateY(0)}
.clickable .test.closed:hover .front{border-color:var(--signal);background:var(--panel-3);box-shadow:0 0 1rem var(--signal-a)}
.test .t-top{display:flex;align-items:center;gap:.45rem;color:var(--muted);font-size:.72rem;font-weight:800}
.test .t-top .n{font-family:var(--f-mono);font-size:.74rem;color:var(--ink-2);border:1px solid var(--line-2);border-radius:6px;padding:0 .3rem}
.test .t-top .ico{width:1.25rem;height:1.25rem;color:var(--signal)}
.test .t-top .cost{margin-left:auto;color:var(--alarm);font-family:var(--f-mono)}
.test .t-t{font-weight:800;font-size:.96rem;line-height:1.25;color:var(--ink)}
.test .back .t-t{font-size:.76rem;color:var(--muted);font-weight:700}
.test .res{display:flex;gap:.5rem;align-items:flex-start;font-weight:800;font-size:1.04rem;line-height:1.28}
.tone{width:1.6rem;height:1.6rem;border-radius:8px;display:grid;place-items:center;flex:none;font-family:var(--f-mono);font-weight:800;font-size:.95rem;color:var(--panel);background:var(--toc)}
.tone.up{--toc:var(--up)} .tone.down{--toc:var(--down)} .tone.norm{--toc:var(--norm)} .tone.found{--toc:var(--found)} .tone.info{--toc:var(--info)}
.test .by{margin-top:auto;font-size:.68rem;font-weight:800;color:var(--tc,var(--muted));letter-spacing:.04em;text-transform:uppercase}
.test.fresh .back{animation:freshglow 1.6s ease}
@keyframes freshglow{0%,30%{box-shadow:0 0 0 0 var(--signal-a)}50%{box-shadow:0 0 1.6rem .2rem var(--signal-a)}100%{box-shadow:none}}

/* итог дела */
.closep{flex:1;min-height:0;overflow:auto;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.85rem}
.closep h2{font-family:var(--f-display);font-size:1.25rem;letter-spacing:.02em}
.verdict{font-size:1.08rem;font-weight:800;line-height:1.35;padding:.8rem .9rem;border-radius:12px;background:var(--alarm-a);border:1px solid var(--alarm)}
.res-line{display:flex;gap:.6rem;align-items:flex-start;font-size:.92rem;line-height:1.35}
.res-line .k{flex:none;width:7.8rem;color:var(--muted);font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding-top:.15rem}
.deltas{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.delta{border-radius:12px;padding:.5rem .6rem;background:var(--panel-2);border:1px solid var(--line);border-top:3px solid var(--tc)}
.delta b{display:block;font-family:var(--f-mono);font-size:1.3rem}
.delta span{font-size:.74rem;color:var(--muted);font-weight:800}

/* штабы */
.bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(17rem,1.35fr);gap:.7rem}
.team{display:flex;align-items:center;gap:.8rem;padding:.65rem .9rem;border-radius:16px;background:var(--panel);border:1px solid var(--line);position:relative;min-width:0;transition:border-color .2s,box-shadow .2s,opacity .2s}
.team .tn{font-weight:800;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .ts{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:.1rem}
.team .tinfo{flex:1;min-width:0}
.team .sc{font-family:var(--f-mono);font-weight:800;font-size:2rem;line-height:1;color:var(--ink)}
.team .sw{width:.55rem;align-self:stretch;border-radius:4px;background:var(--tc);flex:none}
.team.now{border-color:var(--tc);box-shadow:0 0 0 1px var(--tc),0 0 1.6rem var(--tca)}
.team.now .ts{color:var(--tc)}
.team.out{opacity:.5}
.team.out .tn{text-decoration:line-through}
.ringbox{position:relative;width:3.1rem;height:3.1rem;flex:none}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox .rbg{fill:none;stroke:var(--panel-3);stroke-width:5}
.ringbox .rfg{fill:none;stroke:var(--tc);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.ringbox .rtx{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-weight:800;font-size:.95rem}
.ringbox.low .rfg{stroke:var(--alarm)} .ringbox.low .rtx{color:var(--alarm);animation:breathe .8s ease-in-out infinite}
.float{position:absolute;right:1rem;top:-.4rem;font-family:var(--f-mono);font-weight:800;font-size:1.5rem;color:var(--gold);text-shadow:0 0 1rem var(--gold-a);pointer-events:none;animation:floatup 1.8s ease forwards}
.float.neg{color:var(--alarm);text-shadow:0 0 1rem var(--alarm-a)}
@keyframes floatup{0%{opacity:0;transform:translateY(.6rem) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.15)}75%{opacity:1}100%{opacity:0;transform:translateY(-1.6rem)}}
.prompt{display:flex;align-items:center;gap:.8rem;padding:.6rem .9rem;border-radius:16px;background:var(--panel-2);border:1px dashed var(--line-2);min-width:0}
.prompt .say{flex:1;min-width:0;font-size:.92rem;line-height:1.3}
.prompt .say b{color:var(--ink)}
.prompt .say .lbl{display:block;margin-bottom:.15rem}

/* ===== оверлеи ===== */
#ov:empty{display:none}
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:1.2rem 16px;background:var(--veil);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow:auto;animation:fadein .25s ease}
.ov.clear{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{background:var(--panel);border:1px solid var(--line-2);border-radius:24px;padding:1.5rem 1.7rem;box-shadow:0 2rem 5rem var(--shadow);width:min(100%,60rem);max-height:calc(100vh - 2.4rem);overflow:auto;position:relative;animation:sheetin .45s cubic-bezier(.2,.9,.25,1)}
@keyframes sheetin{from{opacity:0;transform:translateY(1.5rem) scale(.98)}to{opacity:1;transform:none}}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:1.6rem;letter-spacing:.01em}
.sheet .x{position:absolute;top:1rem;right:1rem}

/* поступление */
.intro{width:min(100%,64rem);padding:0;overflow:auto;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.intro .ia{padding:1.8rem 1.9rem;display:flex;flex-direction:column;gap:1rem}
.intro .ib{background:var(--panel-2);border-left:1px solid var(--line);padding:1.8rem 1.6rem;display:flex;flex-direction:column;gap:.8rem}
.adm{display:flex;align-items:center;gap:.6rem;font-family:var(--f-display);font-size:.72rem;letter-spacing:.2em;color:var(--alarm);font-weight:700}
.adm i{width:.6rem;height:.6rem;border-radius:50%;background:var(--alarm);box-shadow:0 0 .8rem var(--alarm);animation:breathe 1s ease-in-out infinite}
.intro h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,3.4vw,3.4rem);line-height:1.04;letter-spacing:-.01em}
.intro .casenum{font-family:var(--f-mono);color:var(--muted);font-weight:700;font-size:.95rem}
.intro .pl{font-size:1.15rem;font-weight:800}
.intro .cmp{font-size:1.15rem;line-height:1.42;font-weight:700;color:var(--ink-2)}
.intro .facts li{font-size:1rem;opacity:0;animation:factin .4s ease forwards}
@keyframes factin{from{opacity:0;transform:translateX(-.6rem)}to{opacity:1;transform:none}}
.starter{display:inline-flex;align-items:center;gap:.6rem;padding:.55rem .85rem;border-radius:12px;border:1.5px solid var(--tc);background:var(--tca);font-weight:800;width:fit-content}
.starter .sw{width:.7rem;height:.7rem;border-radius:50%;background:var(--tc)}

/* лечение */
.treat{width:min(100%,74rem)}
.treat-head{display:flex;gap:1rem;align-items:flex-start}
.treat-head .q{font-family:var(--f-display);font-weight:700;font-size:clamp(1.25rem,2vw,1.9rem);line-height:1.2;flex:1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:1.1rem}
.opt{display:flex;gap:.9rem;align-items:center;padding:1rem 1.1rem;border-radius:16px;border:1.5px solid var(--line-2);background:var(--panel-2);font-weight:800;font-size:1.12rem;line-height:1.3;text-align:left;position:relative;min-height:4.6rem;transition:border-color .3s,background .3s,opacity .3s}
.opt .L{width:2.5rem;height:2.5rem;border-radius:12px;display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:700;font-size:1.15rem;background:var(--panel-3);border:1px solid var(--line-2)}
.opt.ok{border-color:var(--gold);background:var(--gold-a);box-shadow:0 0 2rem var(--gold-a)}
.opt.ok .L{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.opt.no{opacity:.45}
.opt .pickers{position:absolute;right:.7rem;bottom:.45rem;display:flex;gap:.3rem}
.pk{font-size:.66rem;font-weight:800;padding:.12rem .45rem;border-radius:999px;background:var(--tc);color:var(--panel)}
.entry{margin-top:1.2rem;display:grid;gap:.5rem;padding:1rem;border-radius:16px;background:var(--panel-2);border:1px solid var(--line)}
.erow{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.erow .en{width:auto;min-width:9rem;max-width:15rem;font-weight:800;display:flex;align-items:center;gap:.5rem;min-width:0}
.erow .en i{width:.65rem;height:.65rem;border-radius:50%;background:var(--tc);flex:none}
.erow .en span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-btn{min-width:2.8rem;padding:.45rem .7rem;border-radius:10px;border:1.5px solid var(--line-2);background:var(--panel);cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:.95rem}
.chip-btn:hover{border-color:var(--ink-2)}
.chip-btn.sel{background:var(--tc,var(--primary));border-color:var(--tc,var(--primary));color:var(--panel)}
.chip-btn.none{font-family:var(--f-body);font-size:.8rem}
.erow .res{margin-left:auto;font-weight:800;font-family:var(--f-mono)}
.erow .res.ok{color:var(--gold)} .erow .res.no{color:var(--muted)}
.ringbig{position:relative;width:4.6rem;height:4.6rem;flex:none;--tc:var(--signal)}
.ringbig svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbig .rbg{fill:none;stroke:var(--panel-3);stroke-width:6}
.ringbig .rfg{fill:none;stroke:var(--signal);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.ringbig .rtx{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-weight:800;font-size:1.25rem}
.ringbig.low .rfg{stroke:var(--alarm)} .ringbig.low .rtx{color:var(--alarm)}

/* подтверждение */
.confirm{width:min(100%,40rem);text-align:left;display:grid;gap:1rem}
.confirm .big{font-size:1.25rem;font-weight:800;line-height:1.35}
.confirm .vn{display:inline-grid;place-items:center;width:2.3rem;height:2.3rem;border-radius:50%;background:var(--alarm);color:#fff;font-family:var(--f-display);font-weight:700;margin-right:.5rem;vertical-align:middle}

/* вспышки-уведомления */
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;display:grid;place-items:center}
.splash{padding:1.3rem 2rem;border-radius:24px;background:var(--panel);border:2px solid var(--sc,var(--signal));box-shadow:0 0 4rem var(--sca,var(--signal-a)),0 1.5rem 4rem var(--shadow);text-align:center;max-width:min(92vw,46rem);animation:splash 2.4s cubic-bezier(.2,.9,.3,1) forwards}
.splash .s1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,3.6vw,3.3rem);letter-spacing:.02em;color:var(--sc,var(--signal));line-height:1.05}
.splash .s2{font-size:1.15rem;font-weight:800;margin-top:.5rem;color:var(--ink)}
.splash.good{--sc:var(--gold);--sca:var(--gold-a)}
.splash.bad{--sc:var(--alarm);--sca:var(--alarm-a);animation:splash 2.4s cubic-bezier(.2,.9,.3,1) forwards,shake .5s ease .1s}
.splash.info{--sc:var(--signal);--sca:var(--signal-a)}
@keyframes splash{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1.04)}20%{transform:scale(1)}82%{opacity:1}100%{opacity:0;transform:scale(.97)}}
@keyframes shake{0%,100%{translate:0}20%{translate:-12px}40%{translate:10px}60%{translate:-6px}80%{translate:4px}}
.burst{position:fixed;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:79}
.burst i{position:absolute;width:.55rem;height:.55rem;border-radius:2px;background:var(--bc);animation:burst 1.4s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes burst{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rr));opacity:0}}
.pausebar{position:fixed;left:50%;top:4.2rem;transform:translateX(-50%);z-index:70;padding:.5rem 1rem;border-radius:999px;background:var(--alarm);color:#fff;font-family:var(--f-display);font-size:.8rem;letter-spacing:.14em;box-shadow:0 0 2rem var(--alarm-a)}

/* ===== полноэкранные: старт, финал, итоги, разбор ===== */
.full{position:fixed;inset:0;z-index:40;overflow:auto;background:transparent;padding-block:1.4rem 2rem;padding-inline:16px}
.full-in{width:min(100%,92rem);margin:0 auto;display:flex;flex-direction:column;gap:1.3rem;overflow-x:clip}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:1.4rem;align-items:stretch}
.hero-l{position:relative;padding:1.8rem 1.9rem;border-radius:24px;background:var(--panel);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;gap:.9rem;justify-content:flex-end;min-height:16rem}
.hero-l canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.hero-l > *:not(canvas){position:relative}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.2rem,4.4vw,5.2rem);font-size:clamp(2.2rem,10.6cqi,5.4rem);line-height:.95;letter-spacing:-.02em}
.hero h1 span{color:var(--alarm);text-shadow:0 0 2rem var(--alarm-a)}
.hero .lead{font-size:1.1rem;max-width:42rem;color:var(--ink-2);font-weight:700;line-height:1.45}
.hero-r{padding:1.3rem 1.4rem;border-radius:24px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:.9rem}
.field{display:grid;gap:.3rem}
.field label{font-size:.78rem;font-weight:800;color:var(--muted)}
.inp{font:inherit;font-weight:800;padding:.6rem .8rem;border-radius:12px;border:1.5px solid var(--line-2);background:var(--panel-2);color:var(--ink);width:100%}
.inp:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 3px var(--signal-a)}
.tnames{display:grid;gap:.5rem}
.tname{display:flex;align-items:center;gap:.6rem}
.tname i{width:.8rem;height:.8rem;border-radius:50%;background:var(--tc);flex:none;box-shadow:0 0 .7rem var(--tc)}
.opts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem .8rem}
.stepper{display:flex;align-items:center;gap:.35rem}
.stepper b{min-width:3.4rem;text-align:center;font-family:var(--f-mono);font-size:1.05rem}
.toggle{display:flex;align-items:center;gap:.6rem;cursor:pointer;font-weight:800;font-size:.9rem;padding:.3rem 0}
.toggle input{width:1.15rem;height:1.15rem;accent-color:var(--signal)}
.sect-h{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap}
.sect-h h2{font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:.7rem}
.case-card{position:relative;text-align:left;padding:.9rem 1rem 1rem;border-radius:16px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;display:flex;flex-direction:column;gap:.4rem;min-height:8.4rem;transition:border-color .15s,background .15s,opacity .15s}
.case-card:hover{border-color:var(--ink-2)}
.case-card.on{border-color:var(--signal);background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--signal)}
.case-card.offc{opacity:.78;border-style:dashed}
.case-card .cc-top{display:flex;align-items:center;gap:.5rem;font-size:.74rem;font-weight:800;color:var(--muted)}
.case-card .cc-top .task{font-family:var(--f-mono);color:var(--ink-2);border:1px solid var(--line-2);border-radius:6px;padding:0 .35rem}
.case-card .chk{margin-left:auto;width:1.4rem;height:1.4rem;border-radius:7px;border:1.5px solid var(--line-2);display:grid;place-items:center;font-weight:900;font-size:.85rem}
.case-card.on .chk{background:var(--signal);border-color:var(--signal);color:var(--primary-ink)}
.case-card h3{font-family:var(--f-display);font-weight:700;font-size:1rem;line-height:1.2}
.case-card .cc-p{font-size:.84rem;color:var(--muted);font-weight:700}
.case-card .cc-t{margin-top:auto;font-size:.76rem;font-weight:800;color:var(--ink-2)}
.est{font-family:var(--f-mono);font-weight:800}
.resume{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:1rem 1.2rem;border-radius:16px;border:1.5px solid var(--gold);background:var(--gold-a)}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem;margin-top:1rem}
.hcard{padding:1rem 1.05rem;border-radius:16px;background:var(--panel-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:.45rem}
.hcard .hn{font-family:var(--f-display);font-weight:700;font-size:.72rem;letter-spacing:.14em;color:var(--signal)}
.hcard h3{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.hcard p{font-size:.95rem;line-height:1.42;color:var(--ink-2);font-weight:700}
.hcard p b{color:var(--ink)}
.faq{margin-top:1rem;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem 1.2rem}
.faq div{font-size:.9rem;line-height:1.4;color:var(--ink-2);font-weight:700;padding:.55rem 0;border-top:1px solid var(--line)}
.faq b{display:block;color:var(--ink);margin-bottom:.15rem}

/* финал */
.fin-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:1.2rem;align-items:start}
.fin-dia{padding:.6rem}
.fopts{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.fopt{display:flex;gap:.7rem;align-items:center;padding:.75rem .85rem;border-radius:14px;border:1.5px solid var(--line-2);background:var(--panel-2);font-weight:800;font-size:.98rem;line-height:1.3;min-height:4.2rem;transition:all .4s}
.fopt .fn{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:700;background:var(--panel-3);border:1px solid var(--line-2)}
.fopt.yes{border-color:var(--gold);background:var(--gold-a);animation:popin .45s cubic-bezier(.2,1.5,.4,1)}
.fopt.yes .fn{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.fopt.no{opacity:.72;animation:popin .45s ease}
.fopt.no .fn{background:var(--alarm-a);color:var(--alarm);border-color:var(--alarm)}
.deb-card .fopt.no{opacity:1}
.fentry{display:grid;gap:.55rem}
.frow{display:grid;grid-template-columns:minmax(9rem,15rem) auto 1fr auto;gap:.7rem;align-items:center;padding:.65rem .8rem;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--tc)}
.frow .en{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .picks{display:flex;gap:.3rem;flex-wrap:wrap}
.frow .picks .chip-btn{min-width:2.3rem;padding:.35rem .5rem;font-size:.85rem}
.frow .picks .chip-btn.hit{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.frow .picks .chip-btn.miss{background:var(--alarm);border-color:var(--alarm);color:#fff}
.frow .out{font-family:var(--f-mono);font-weight:800;font-size:1.15rem;min-width:4rem;text-align:right}
.frow .out.ok{color:var(--gold)} .frow .out.no{color:var(--alarm)}

/* итоги */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;align-items:stretch;max-width:70rem;margin:0 auto;width:100%}
.pod{border-radius:20px 20px 12px 12px;background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--tc);padding:1.1rem 1.1rem 1.2rem;text-align:center;display:flex;flex-direction:column;gap:.35rem;animation:sheetin .6s cubic-bezier(.2,.9,.25,1) both}
.pod.p1{min-height:15rem;box-shadow:0 0 3rem var(--tca)} .pod.p2{margin-top:2.6rem} .pod.p3{margin-top:5.2rem}
.pod .place{font-family:var(--f-display);font-weight:800;font-size:2.4rem;color:var(--tc)}
.pod .pn{font-weight:800;font-size:1.2rem}
.pod .ps{font-family:var(--f-mono);font-weight:800;font-size:2.6rem;line-height:1}
.pod .pst{font-size:.82rem;color:var(--muted);font-weight:700;margin-top:auto;line-height:1.5}
.winner{text-align:center;font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,3.4vw,3rem);line-height:1.1}
.winner span{color:var(--gold);text-shadow:0 0 2rem var(--gold-a)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem;max-width:70rem;margin:0 auto;width:100%}
.stat{padding:.9rem 1rem;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--f-mono);font-size:1.7rem;font-weight:800}
.stat span{font-size:.82rem;color:var(--muted);font-weight:800}

/* разбор */
.deb{display:grid;grid-template-columns:17rem minmax(0,1fr);gap:1.2rem;align-items:start}
.deb-nav{position:sticky;top:0;display:flex;flex-direction:column;gap:.35rem}
.deb-nav button{display:flex;gap:.6rem;align-items:center;text-align:left;padding:.55rem .7rem;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:800;font-size:.88rem;line-height:1.25}
.deb-nav button:hover{border-color:var(--ink-2)}
.deb-nav button.sel{border-color:var(--signal);background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--signal)}
.deb-nav .task{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2);border:1px solid var(--line-2);border-radius:6px;padding:0 .3rem;flex:none}
.deb-nav .st{margin-left:auto;font-size:.8rem;flex:none}
.deb-main{display:flex;flex-direction:column;gap:1rem;min-width:0}
.deb-card{padding:1.1rem 1.3rem;border-radius:18px;background:var(--panel);border:1px solid var(--line);min-width:0}
.deb-card h2{font-family:var(--f-display);font-weight:700;font-size:1.5rem}
.deb-card h3{font-family:var(--f-display);font-weight:700;font-size:.95rem;margin-bottom:.6rem;letter-spacing:.02em}
.deb-task{font-size:1.05rem;line-height:1.5;font-weight:700;color:var(--ink-2)}
.pts{margin:0;padding:0;list-style:none;display:grid;gap:.55rem;counter-reset:p}
.pts li{display:flex;gap:.7rem;font-size:1rem;line-height:1.5;font-weight:600;color:var(--ink)}
.pts li::before{counter-increment:p;content:counter(p);flex:none;width:1.7rem;height:1.7rem;border-radius:8px;display:grid;place-items:center;background:var(--panel-3);font-family:var(--f-mono);font-weight:800;font-size:.85rem;color:var(--signal);margin-top:.1rem}
.deb-2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1rem;align-items:start}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{text-align:left;padding:.5rem .55rem;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.35}
.tbl th{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.tbl td.cut{font-family:var(--f-mono);font-weight:800;color:var(--alarm);white-space:nowrap}
.tbl tr.seen td:first-child{box-shadow:inset 3px 0 0 var(--tc,var(--signal))}
.played{display:grid;gap:.45rem;font-size:.95rem;font-weight:700;line-height:1.4}

@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}

/* ===== узкие экраны ===== */
@media (max-width:1180px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  .stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .stage .cx{grid-column:1 / -1;grid-row:1}
  .diap{min-height:24rem}
  .bar{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bar .prompt{grid-column:1 / -1}
  .intro{grid-template-columns:1fr}
  .intro .ib{border-left:0;border-top:1px solid var(--line)}
  .hero,.fin-grid,.deb-2{grid-template-columns:1fr}
  .deb{grid-template-columns:1fr}
  .deb-nav{position:static;flex-direction:row;flex-wrap:wrap}
  .howto{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  html{font-size:calc(14px * var(--ui,1))}
  .stage{grid-template-columns:1fr}
  .vers,.tests,.opts,.fopts,.opts-grid,.howto,.faq{grid-template-columns:1fr}
  .bar{grid-template-columns:1fr}
  .podium{grid-template-columns:1fr}
  .pod.p1,.pod.p2,.pod.p3{min-height:0;margin-top:0}
  .frow{grid-template-columns:1fr}
  .crumb .ttl{white-space:normal}
  .right{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* без повторных анимаций при перерисовке */
#ov.noanim .ov,#ov.noanim .sheet,#ov.noanim .facts li{animation:none!important;opacity:1}
.full.noanim .pod,.full.noanim .fopt,.full.noanim .case-card,.full.noanim .crack,.full.noanim .brktag{animation:none!important}
.full.noanim .fopt.just{animation:popin .45s cubic-bezier(.2,1.5,.4,1)!important}
.case-card .cc-p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#toast{position:fixed;left:50%;bottom:1.2rem;z-index:90;transform:translate(-50%,1rem);opacity:0;pointer-events:none;padding:.6rem 1.1rem;border-radius:999px;background:var(--panel-3);border:1px solid var(--line-2);color:var(--ink);font-weight:800;box-shadow:0 1rem 2.5rem var(--shadow);transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
.deb-dia{border-radius:14px;background:var(--panel-2);border:1px solid var(--line);padding:.3rem}
.deb-dia .dia,.fin-dia .dia{height:auto}

.z-out{fill:var(--z-out)}
.full-in.center{min-height:calc(100vh - 3.6rem);justify-content:center}

/* ===== узоры органов ===== */
.diap{position:relative}
.motif{position:absolute;right:0;bottom:0;width:62%;height:80%;pointer-events:none;color:var(--motif);z-index:0}
.diap .motif{display:none} /* схема теперь сама рисует компартменты — мотив органа за ней только шумит */
.motif svg,.ia-motif svg,.fin-motif svg{width:100%;height:100%;display:block}
.motif svg *,.ia-motif svg *,.fin-motif svg *{fill:none;stroke:currentColor;stroke-width:2px;vector-effect:non-scaling-stroke}
.motif svg .f,.ia-motif svg .f,.fin-motif svg .f{fill:currentColor;stroke:none}
.diap .pnl-h,.diap .diabox{position:relative;z-index:1}
.intro .ia{position:relative;overflow:hidden}
.intro .ia > *:not(.ia-motif){position:relative}
.ia-motif{position:absolute;right:-1.5rem;bottom:-1rem;width:72%;height:82%;color:var(--motif-strong);pointer-events:none}
.full .full-in{position:relative;z-index:1}
.fin-motif{position:absolute;right:0;top:-1rem;width:46%;height:22rem;color:var(--motif-strong);pointer-events:none;z-index:-1}

/* ===== штамп и архив смены ===== */
.pcard{position:relative}
.stamp{--sc:var(--ok);position:absolute;left:50%;top:42%;z-index:6;pointer-events:none;transform:translate(-50%,-50%) rotate(-11deg);opacity:.93;
  border:4px solid var(--sc);outline:2px solid var(--sc);outline-offset:4px;border-radius:10px;padding:.6rem 1.1rem .55rem;color:var(--sc);background:var(--panel);
  font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;text-align:center;line-height:1.05;font-size:1.3rem;white-space:nowrap;
  box-shadow:0 0 2.2rem var(--sca,var(--ok-a))}
.stamp.no{--sc:var(--alarm);--sca:var(--alarm-a)}
.stamp small{display:block;font-size:.7rem;letter-spacing:.12em;margin-top:.45rem;font-weight:600;text-transform:none}
.stamp.go{animation:stampin .5s cubic-bezier(.2,.9,.3,1.35) .35s both}
@keyframes stampin{0%{opacity:0;transform:translate(-50%,-50%) rotate(-24deg) scale(2.6)}65%{opacity:1;transform:translate(-50%,-50%) rotate(-11deg) scale(.93)}100%{opacity:.93;transform:translate(-50%,-50%) rotate(-11deg) scale(1)}}
.pcard.thud{animation:thud .4s ease .78s}
@keyframes thud{0%,100%{translate:0 0}20%{translate:-6px 4px}45%{translate:5px -3px}70%{translate:-3px 1px}}
.archive{margin-top:auto;padding-top:.7rem;border-top:1px dashed var(--line-2);display:grid;gap:.5rem}
.arch-h{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.arch-n{font-size:.78rem;color:var(--ink-2);font-weight:800}
.arch-empty{font-size:.8rem;color:var(--muted);font-weight:700}
.arch-cards{position:relative;height:4.7rem;max-width:100%}
.acard{position:absolute;bottom:.15rem;width:3.3rem;height:4.2rem;border-radius:6px;background:var(--panel-3);border:1px solid var(--line-2);box-shadow:0 .35rem .9rem var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;transform:rotate(var(--r));font-family:var(--f-mono)}
.acard b{font-size:.78rem;color:var(--ink-2)}
.acard i{font-style:normal;font-size:.95rem;font-weight:900;width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor;transform:rotate(-12deg)}
.acard.ok i{color:var(--ok)} .acard.no i{color:var(--alarm)}
.acard.new{opacity:0}
.acard.landed{animation:aland .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes aland{0%{transform:rotate(var(--r)) scale(1.12)}100%{transform:rotate(var(--r))}}
@keyframes dropin{0%{opacity:0;transform:translateY(-3.5rem) rotate(calc(var(--r) - 25deg)) scale(1.35)}100%{opacity:1;transform:rotate(var(--r))}}

/* ===== досье ===== */
.dos-btn .ico{color:var(--alarm)}
.dossier{position:relative;background:var(--paper);border:1px solid var(--line-2);border-radius:6px 18px 18px 18px;padding:1.2rem 1.4rem 4rem;overflow:hidden;box-shadow:0 1.2rem 3rem var(--shadow)}
.dz-top{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-family:var(--f-display);font-size:.66rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--alarm);border-bottom:2px solid var(--alarm);padding-bottom:.55rem;margin-bottom:1rem}
.dlines{list-style:none;margin:0;padding:0;display:grid;gap:.55rem}
.dl{display:flex;gap:.7rem;align-items:flex-start;font-family:var(--f-mono);font-size:.9rem;line-height:1.45;color:var(--paper-ink);font-weight:600}
.dl .dn{color:var(--muted);flex:none;font-weight:800}
.dl .dt{position:relative;flex:1;min-width:0}
.dl .tx.red{display:inline-block;height:1.05em;background:var(--redact);border-radius:2px;vertical-align:middle;border:1px solid var(--line)}
.dl .bar{position:absolute;inset:-.1rem -.25rem;background:var(--redact);border-radius:2px;transform-origin:right center;display:none}
.dl.fresh .bar{display:block;animation:unredact .75s cubic-bezier(.6,0,.2,1) var(--d,0s) forwards}
@keyframes unredact{to{transform:scaleX(0)}}
.dl.fresh .tx{animation:glowtext 1.6s ease var(--d,0s)}
@keyframes glowtext{0%,40%{color:var(--gold)}100%{color:var(--paper-ink)}}
.dz-stamp{position:absolute;right:1.2rem;bottom:1rem;transform:rotate(-13deg);border:4px solid var(--alarm);color:var(--alarm);font-family:var(--f-display);font-weight:800;letter-spacing:.12em;padding:.3rem .8rem;border-radius:8px;opacity:.8;font-size:1.15rem;pointer-events:none}
.dz-stamp.ok{border-color:var(--ok);color:var(--ok)}
.dz-stamp.go{animation:dzstamp .5s cubic-bezier(.2,.9,.3,1.35) var(--sd,0s) both}
@keyframes dzstamp{0%{opacity:0;transform:rotate(-30deg) scale(2.6)}100%{opacity:.85;transform:rotate(-13deg) scale(1)}}
.dossier.big{padding:1.6rem 1.8rem 6.6rem}
.dossier.big .dl{font-size:1.12rem}
.dossier.big .dz-stamp{font-size:1.7rem;bottom:1.6rem}
.dos-mini{border-radius:14px;border:1px solid var(--line-2);background:var(--paper);padding:.75rem .85rem;display:grid;gap:.55rem}
.dos-h{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-family:var(--f-display);font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--alarm)}
.dos-h span{display:flex;align-items:center;gap:.4rem}
.dos-h b{font-size:.85rem;color:var(--ink)}
.fin-dos{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:2rem;align-items:center;max-width:84rem;margin:0 auto;width:100%}
.fin-dos-l{display:flex;flex-direction:column;gap:1rem;align-items:flex-start}
.fin-dos-l h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,4vw,3.6rem);line-height:1.02}
.fin-dos-l p{font-size:1.15rem;font-weight:700;color:var(--ink-2);line-height:1.5}
.full.noanim .dl .bar{display:none}
.full.noanim .dz-stamp,.full.noanim .dl .tx{animation:none}
.howto2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.7rem}

/* ===== значки ===== */
.bdgs{display:flex;gap:.25rem;flex:none}
.bdg{position:relative;width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--gold);color:var(--gold);background:var(--gold-a)}
.bdg .ico{width:.95rem;height:.95rem}
.bdg sup{position:absolute;right:-.35rem;top:-.4rem;font-family:var(--f-mono);font-size:.6rem;font-weight:800;background:var(--gold);color:var(--gold-ink);border-radius:999px;padding:0 .25rem;line-height:1.3}
.pbad{display:flex;flex-wrap:wrap;gap:.4rem .6rem;justify-content:center;margin-top:.5rem}
.pbad .bdg{width:auto;height:auto;border-radius:999px;padding:.2rem .55rem .2rem .35rem;display:inline-flex;gap:.3rem;align-items:center}
.pbad .bdg em{font-style:normal;font-size:.74rem;font-weight:800}
.pbad .bdg sup{position:static;margin-left:.1rem}
#medal{position:fixed;right:1.2rem;top:4.6rem;z-index:86;pointer-events:none}
.medal{display:flex;gap:.85rem;align-items:center;padding:.75rem 1.1rem .75rem .75rem;border-radius:18px;background:var(--panel);border:2px solid var(--gold);box-shadow:0 0 2.4rem var(--gold-a),0 1rem 2.5rem var(--shadow);max-width:25rem;animation:medalin 3.4s ease forwards}
.medal .mi{width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--gold-ink);flex:none;box-shadow:0 0 0 4px var(--gold-a);animation:medalspin .9s cubic-bezier(.2,.9,.3,1.3) .15s both}
.medal .mi .ico{width:1.7rem;height:1.7rem}
.medal .mn{font-family:var(--f-display);font-weight:800;font-size:1.3rem;margin-top:.1rem}
.medal .mw{font-size:.86rem;font-weight:700;color:var(--ink-2);line-height:1.35}
@keyframes medalin{0%{opacity:0;transform:translateX(115%)}10%{opacity:1;transform:none}86%{opacity:1;transform:none}100%{opacity:0;transform:translateX(115%)}}
@keyframes medalspin{from{transform:rotateY(180deg) scale(.4)}to{transform:none}}

/* ===== пауза перед вердиктом ===== */
.spot{position:fixed;inset:0;z-index:76;cursor:wait;background:radial-gradient(circle at var(--x) var(--y),transparent 0 var(--r,58px),rgba(2,4,10,.42) calc(var(--r,58px) + 22px),rgba(2,4,10,.88) calc(var(--r,58px) + 160px));animation:fadein .35s ease both}
.spot-lbl{position:absolute;display:flex;align-items:center;gap:.3rem;transform:translate(-50%,0);padding:.5rem 1rem;border-radius:999px;background:var(--panel);border:2px solid var(--tc);font-weight:800;font-size:1.05rem;white-space:nowrap;color:var(--ink);box-shadow:0 0 2rem var(--tca)}
.spot-lbl .dots i{font-style:normal;animation:blink 1.2s infinite}
.spot-lbl .dots i:nth-child(2){animation-delay:.2s} .spot-lbl .dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.15}50%{opacity:1}}
.pin.suspect .pc{transform-box:fill-box;transform-origin:center;animation:suspect .45s ease-in-out infinite alternate}
.pin.suspect .halo{opacity:1;stroke:var(--ink);transform-box:fill-box;transform-origin:center;animation:ring 1s ease-out infinite}
@keyframes suspect{from{transform:scale(1)}to{transform:scale(1.28)}}
.ver.suspect{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
@media (max-width:1180px){.fin-dos,.howto2{grid-template-columns:1fr}}

.full-in.center{padding-top:3.4rem}
.full-in.center > .row:first-child{position:absolute;top:0;left:0;right:0}
#medal.at-team .medal{animation:medalup 3.4s ease forwards}
@keyframes medalup{0%{opacity:0;transform:translateY(1.4rem) scale(.85)}10%{opacity:1;transform:none}86%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-.8rem)}}

/* ======================= v4: молекулы, графики, механизмы, атлас, код синий ======================= */
:root{--coop:#8796FF;--coop-a:rgba(135,150,255,.2);--c0:#2766CC;--c1:#D96A2A;--c2:#AE7EE8}
:root[data-look="day"]{--coop:#3F4FD8;--coop-a:rgba(63,79,216,.13);--c0:#1E5BC6;--c1:#C4541A;--c2:#A070E8}
.tcolc{--tc:var(--coop);--tca:var(--coop-a)}
.tag.blue{border-color:var(--coop);color:var(--coop);animation:breathe 1.2s ease-in-out infinite}
.blue-chip{display:inline-block;vertical-align:middle;font-family:var(--f-body);font-size:.62rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:.1rem .4rem;border-radius:999px;background:var(--coop);color:var(--panel)}
.case-card.bluecard{border-style:dashed}
.case-card.bluecard.on{border-color:var(--coop);box-shadow:inset 0 0 0 1px var(--coop);border-style:solid}
.case-card.bluecard.on .chk{background:var(--coop);border-color:var(--coop)}
.case-card.bluecard h3{color:var(--coop)}
.bluev{min-width:9rem!important;font-family:var(--f-body)!important;font-size:.86rem!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:11rem}
.btn.on{border-color:var(--signal);color:var(--signal)}
.bluet{font-family:var(--f-mono);font-weight:800;font-size:2rem;line-height:1;color:var(--coop);text-shadow:0 0 1rem var(--coop-a);padding:.2rem .5rem;border-radius:10px;border:1.5px solid var(--coop)}
.bluet.low{color:var(--alarm);border-color:var(--alarm);animation:breathe .8s ease-in-out infinite}
.splash.blue{--sc:var(--coop);--sca:var(--coop-a)}
.intro.blue{border-color:var(--coop);box-shadow:0 0 0 2px var(--coop),0 2rem 5rem var(--shadow),0 0 4rem var(--coop-a)}
.intro.blue .adm{color:var(--coop)} .intro.blue .adm i{background:var(--coop);box-shadow:0 0 .8rem var(--coop)}
.bl-rules{margin:0;padding-left:1.1rem;display:grid;gap:.35rem;font-weight:700;line-height:1.45;color:var(--ink-2)}
.bl-rules b{color:var(--coop)}

/* оттенок интерфейса по состоянию пациента */
@property --gc{syntax:'<color>';inherits:true;initial-value:rgba(0,0,0,0)}
body{--gc:rgba(0,0,0,0);transition:--gc 1.4s ease}
body[data-grade="warn"]{--gc:rgba(255,181,71,.17);--bg-hi1:rgba(255,181,71,.07)}
body[data-grade="crit"]{--gc:rgba(255,62,122,.26);--bg-hi1:rgba(255,62,122,.09)}
body[data-grade="blue"]{--gc:rgba(120,140,255,.3);--bg-hi1:rgba(120,140,255,.1)}
#grade{position:fixed;inset:0;pointer-events:none;z-index:35;background:radial-gradient(130% 100% at 50% 45%,transparent 58%,var(--gc) 100%)}
body[data-grade="crit"] #grade{animation:gradepulse 1.7s ease-in-out infinite}
body[data-grade="blue"] #grade{animation:gradepulse 2.6s ease-in-out infinite}
body.blue-low[data-grade="blue"] #grade{animation-duration:1s}
@keyframes gradepulse{0%,100%{opacity:.65}50%{opacity:1}}
body[data-grade="warn"] .pnl,body[data-grade="warn"] .team{border-color:color-mix(in srgb,var(--line) 62%,var(--up))}
body[data-grade="crit"] .pnl,body[data-grade="crit"] .team{border-color:color-mix(in srgb,var(--line) 50%,var(--alarm))}
body[data-grade="blue"] .pnl,body[data-grade="blue"] .team{border-color:color-mix(in srgb,var(--line) 45%,var(--coop))}
.pnl,.team{transition:border-color 1.2s ease,box-shadow .2s,opacity .2s}
body[data-grade="crit"] .brand svg path{stroke:var(--alarm);animation-duration:1.1s}
body[data-grade="warn"] .brand svg path{stroke:var(--up);animation-duration:1.7s}
body[data-grade="blue"] .brand svg path{stroke:var(--coop);animation-duration:1s}
body:not([data-phase="play"]):not([data-phase="wait"]):not([data-phase="treat"]):not([data-phase="intro"]) #grade{display:none}

/* карта тела в мониторе */
.bmap{position:absolute;left:.55rem;top:1.7rem;bottom:.45rem;width:5rem;display:none;flex-direction:column;align-items:center;gap:.15rem;pointer-events:none;z-index:1;--oc:#FFD25A;--oca:rgba(255,210,90,.2)}
.mon.wmap .bmap{display:flex}
.bmap svg{flex:1;min-height:0;width:100%;overflow:visible}
.bm-body{fill:rgba(127,214,255,.05);stroke:rgba(127,214,255,.38);stroke-width:1.3;stroke-linejoin:round}
.bm-org *{fill:var(--oca);stroke:var(--oc);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.bm-org .skin{fill:none;stroke-width:2.2}
.bmap .bm-org{filter:drop-shadow(0 0 3px var(--oc))}
.bmap .bm-l{font-family:var(--f-mono);font-size:.62rem;font-weight:700;color:var(--oc);text-transform:uppercase;letter-spacing:.04em;text-align:center;line-height:1.15;max-width:5.4rem}
.bmap.s0{--oc:#FFD25A;--oca:rgba(255,210,90,.16)}
.bmap.s1{--oc:#FFB547;--oca:rgba(255,181,71,.3)}
.bmap.s2{--oc:#FF7A4D;--oca:rgba(255,122,77,.38)}
.bmap.s3{--oc:#FF3E7A;--oca:rgba(255,62,122,.5)}
.bmap.s3 .bm-org{animation:orgpulse .9s ease-in-out infinite}
.bmap.dead{--oc:#55606F;--oca:rgba(85,96,111,.3)}
.bmap.dead .bm-body{stroke:rgba(120,130,150,.3)}
@keyframes orgpulse{0%,100%{opacity:.55}50%{opacity:1}}

/* графики на обороте анализа */
.test .back{container-type:size}
.mini{flex:1 1 auto;min-height:2.6rem;max-height:4.6rem;display:flex;flex-direction:column;justify-content:center;gap:.25rem;font-size:.68rem;font-weight:800;color:var(--muted);overflow:hidden;line-height:1.1}
@container (max-height:8.4rem){.mini{display:none}}
.mini .mx,.mini .mcap{font-size:.66rem;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbars .mb{display:grid;grid-template-columns:minmax(3.2rem,max-content) 1fr minmax(1.6rem,auto);align-items:center;gap:.4rem}
.mb-l{white-space:nowrap}
.mb-t{height:.55rem;border-radius:2px;background:var(--panel-2);overflow:hidden}
.mb-t i{display:block;height:100%;border-radius:0 4px 4px 0}
.mb-t i.n{background:var(--muted);opacity:.6}
.mb-t i.p{background:var(--mc)}
.mbars b{color:var(--ink);font-family:var(--f-mono);font-size:.68rem}
.mr-h{display:flex;align-items:baseline;gap:.3rem;white-space:nowrap}
.mr-h b{font-family:var(--f-mono);font-size:.9rem;color:var(--ink)}
.mr-h span{margin-left:auto;overflow:hidden;text-overflow:ellipsis}
.mr-t{position:relative;height:.6rem;border-radius:999px;background:var(--panel-2);margin:.05rem 0}
.mr-n{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--ok-a);box-shadow:inset 0 0 0 1px var(--ok)}
.mr-m{position:absolute;top:50%;width:.85rem;height:.85rem;border-radius:50%;background:var(--mc);border:2px solid var(--panel-3);transform:translate(-50%,-50%)}
.mr-ax{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.56rem}
.mlg{display:flex;gap:.6rem}
.mlg .lg{display:inline-flex;align-items:center;gap:.25rem}
.mlg i{display:inline-block;width:.9rem;height:0;border-top:2px solid var(--mc)}
.mlg .n i{border-top:2px dashed var(--muted)}
.mcurve svg,.mecg svg{width:100%;flex:1 1 auto;min-height:1.2rem;max-height:2.6rem;overflow:visible}
.mcurve path,.mecg path{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.mcurve .p,.mecg path{stroke:var(--mc)}
.mcurve .n{stroke:var(--muted);stroke-dasharray:4 4}
.mcurve .ax{stroke:var(--line-2);stroke-width:1;vector-effect:non-scaling-stroke}
.mp{flex:1 1 auto;min-height:1.2rem;max-height:2.4rem;display:flex;align-items:flex-end;gap:.3rem}
.mp i{flex:1;background:var(--mc);border-radius:4px 4px 0 0;min-height:2px}
.mp i:first-child{background:var(--muted);opacity:.65}
.ms{display:flex;justify-content:space-between;gap:.2rem;border-top:2px solid var(--line-2);padding-top:.3rem;position:relative}
.ms span{position:relative;font-family:var(--f-mono);font-size:.62rem}
.ms span::before{content:'';position:absolute;left:50%;top:-.52rem;width:2px;height:.4rem;background:var(--line-2)}
.ms span.on{color:var(--panel);background:var(--mc);border-radius:6px;padding:0 .3rem}
.ms span.on::before{background:var(--mc);height:.55rem;top:-.62rem}

/* справка по узлу */
.dia .nd{cursor:help}
.dia .nd.picked .nd-in{filter:drop-shadow(0 0 8px var(--kc))}
.pop{position:fixed;z-index:92;display:flex;gap:1rem;align-items:center;width:min(30rem,calc(100vw - 24px));padding:.9rem 1rem;border-radius:18px;background:var(--panel);border:1.5px solid var(--line-2);box-shadow:0 1.4rem 3.5rem var(--shadow);animation:popcard .25s cubic-bezier(.2,1.2,.4,1)}
@keyframes popcard{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.pop-g{width:8.5rem;height:7.5rem;flex:none;background:var(--panel-2);border-radius:12px;border:1px solid var(--line)}
.memb-mini{fill:var(--mem-tail);opacity:.55}
.pop-t{min-width:0;display:grid;gap:.3rem}
.pop-t h4{font-family:var(--f-display);font-weight:700;font-size:1.1rem;margin:0}
.pop-t p{font-size:.9rem;line-height:1.42;font-weight:700;color:var(--ink-2)}
.pop-f{font-size:.7rem;color:var(--muted);font-weight:800}

/* механизм */
.nd-in{transform-box:fill-box;transform-origin:center}
.dia.mech .nd:not(.on){opacity:.14}
.dia.mech [data-e]:not(.on){opacity:.1}
.dia.mech .pins{opacity:.35;transition:opacity .4s}
.comet{fill:var(--signal);filter:drop-shadow(0 0 6px var(--signal))}
.comet.flood,.comet.brk{fill:var(--alarm);filter:drop-shadow(0 0 7px var(--alarm))}
.comet.dim,.comet.amb,.comet.inh{fill:var(--muted);filter:none}
.ringfx{fill:none;stroke:var(--alarm);stroke-width:4;transform-box:fill-box;transform-origin:center;animation:ringfx 1.3s ease-out both}
.ringfx.gold{stroke:var(--gold)}
@keyframes ringfx{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(3.2)}}
.mbadge circle{fill:var(--alarm);stroke:var(--panel);stroke-width:3}
.mbadge path{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mbadge.over path{fill:#fff;stroke:none}
.mbadge.path circle{fill:var(--gold)} .mbadge.path path{stroke:var(--gold-ink)}
.mbadge{transform-box:fill-box;transform-origin:center;animation:popin .45s .15s cubic-bezier(.2,1.6,.4,1) both}
.nd.boom.b-over .nd-in,.nd.boom.b-brakeon .nd-in{animation:boomup .5s ease 3}
.nd.boom.b-block .nd-in,.nd.boom.b-brakeoff .nd-in{animation:boomshake .55s ease}
.nd.boom.b-low .nd-in{animation:boomlow 1.4s ease}
.nd.boom.b-path .nd-in{animation:boomup .6s ease 2}
@keyframes boomup{0%,100%{transform:none}45%{transform:scale(1.12)}}
@keyframes boomshake{0%,100%{transform:none}20%{transform:translateX(-7px) rotate(-3deg)}45%{transform:translateX(6px) rotate(2deg)}70%{transform:translateX(-3px)}}
@keyframes boomlow{0%{opacity:1}20%{opacity:.35}35%{opacity:.9}55%{opacity:.3}100%{opacity:1}}
.mechbtn{font-size:.74rem}

/* сборка схемы после погружения */
.dia.asm .nd-in{animation:ndin .55s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i,0) * 60ms)}
.dia.asm .edges,.dia.asm .pins{animation:fadein .5s ease both;animation-delay:calc(var(--n,8) * 60ms)}
@keyframes ndin{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:none}}

/* погружение */
.diabox{position:relative}
.dive{position:absolute;inset:0;z-index:5;overflow:hidden;background:var(--panel);border-radius:14px;pointer-events:none}
.dv{position:absolute;inset:0;display:grid;place-items:center}
.dv svg{display:block}
.dv-body svg{height:92%;width:auto;opacity:0}
.dive .body .bm-body{fill:var(--panel-2);stroke:var(--line-2);stroke-width:1.2}
.dive .body .bm-org *{fill:var(--alarm-a);stroke:var(--alarm);stroke-width:1.3}
.dive .body .bm-org *{stroke-width:1.6}
.dv-tis svg{width:80%;height:80%;color:var(--motif-strong);opacity:0}
.dv-tis svg *{fill:none;stroke:var(--k-rec);stroke-opacity:.5;stroke-width:2px;vector-effect:non-scaling-stroke}
.dv-tis svg .f{fill:var(--k-rec);fill-opacity:.4;stroke:none}
.dv-cell svg{width:76%;height:86%;opacity:0;transform-origin:50% 15%}
.c-m{fill:var(--panel-2);stroke:var(--k-rec);stroke-opacity:.8;stroke-width:5}
.c-m2{fill:none;stroke:var(--k-rec);stroke-opacity:.35;stroke-width:2.5}
.c-n{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:2.5}
.c-nu{fill:var(--k-gene);opacity:.45}
.c-er{fill:none;stroke:var(--er-line);stroke-width:3;stroke-linecap:round}
.c-mi{fill:none;stroke:var(--k-prot);stroke-width:2.2;opacity:.7}
.c-r{fill:var(--k-rec)}
.dv-cap{position:absolute;left:1rem;bottom:.8rem;display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;font-family:var(--f-display);font-size:.82rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dv-cap span{transition:color .3s,text-shadow .3s}
.dv-cap span.on{color:var(--signal);text-shadow:0 0 .8rem var(--signal-a)}
.dv-cap i{font-style:normal;opacity:.5}

/* переходы */
.veilfx{position:fixed;inset:0;z-index:49;background:var(--veil);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:none}
.flying,.flying *{animation:none!important;transition:none!important}
.flying .facts li{opacity:1}
.acard.flycard{box-shadow:0 0 1.6rem var(--sca,var(--ok-a)),0 .35rem .9rem var(--shadow)}
.acard.flycard.no{--sca:var(--alarm-a)}
@keyframes acpop{0%{opacity:0;transform:rotate(var(--r)) scale(.6)}100%{opacity:1;transform:rotate(var(--r))}}

/* финал: камера отъезжает */
.cine{position:fixed;inset:0;z-index:96;background:var(--bg);display:grid;place-items:center;cursor:pointer;overflow:hidden}
.cn{position:absolute;inset:0;display:grid;place-items:center;opacity:0}
.cn-dia .dia{width:min(80vw,1100px);height:auto}
.cn-tis svg{width:min(80vw,900px);height:auto}
.cn-tis .t-c{fill:var(--panel-2);stroke:var(--line-2);stroke-width:2}
.cn-tis .t-n{fill:var(--nuc-line);opacity:.6}
.cn-tis .t-hi{fill:var(--signal-a);stroke:var(--signal);stroke-width:3;filter:drop-shadow(0 0 10px var(--signal))}
.cn-tis .t-hin{fill:var(--signal)}
.cb-wrap{position:relative;height:min(78vh,720px);aspect-ratio:1/2}
.cb-wrap svg{width:100%;height:100%}
.cine .body .bm-body{fill:var(--panel-2);stroke:var(--line-2);stroke-width:1}
.cine .body .bm-org *{fill:var(--gold-a);stroke:var(--gold);stroke-width:1.1}
.cine.labels .body .bm-org{animation:orgpulse 1.2s ease-in-out infinite;filter:drop-shadow(0 0 4px var(--gold))}
.cb-l{position:absolute;white-space:nowrap;font-family:var(--f-display);font-weight:700;font-size:clamp(.9rem,1.5vw,1.4rem);color:var(--gold);opacity:0;transform:translateY(.6rem);transition:opacity .5s,transform .5s}
.cb-l small{display:block;font-family:var(--f-body);font-weight:800;font-size:.62em;color:var(--ink-2);letter-spacing:.02em}
.cb-l.l1{left:72%;top:22%} .cb-l.l2{right:76%;top:36%;text-align:right} .cb-l.l3{left:72%;top:52%}
.cine.labels .cb-l{opacity:1;transform:none}
.cine.labels .cb-l.l2{transition-delay:.25s} .cine.labels .cb-l.l3{transition-delay:.5s}
.cn-cap{position:absolute;left:50%;bottom:2.2rem;transform:translateX(-50%);display:flex;gap:.7rem;align-items:center;font-family:var(--f-display);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:.85rem;color:var(--muted)}
.cn-cap span.on{color:var(--gold);text-shadow:0 0 1rem var(--gold-a)}
.cn-cap i{font-style:normal;opacity:.5}
.cn-skip{position:absolute;right:1.2rem;bottom:1rem;font-size:.75rem;font-weight:800;color:var(--muted)}

/* вкладки итогов */
.rtabs{display:flex;gap:.3rem;flex-wrap:wrap;padding:.25rem;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.rtabs button{border:0;background:transparent;padding:.45rem .85rem;border-radius:10px;font-weight:800;font-size:.86rem;cursor:pointer;color:var(--ink-2)}
.rtabs button:hover{background:var(--panel-3);color:var(--ink)}
.rtabs button.sel{background:var(--primary);color:var(--primary-ink)}
.empty-note{padding:2rem;text-align:center;font-weight:800;color:var(--muted)}

/* атлас */
.at-wrap{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:1rem;align-items:start}
.at-map{padding:.6rem}
.atlas{width:100%;height:auto;display:block}
.atlas text{font-family:var(--f-body)}
.at-e{stroke:var(--line-2);stroke-width:2.5;fill:none;opacity:.5}
.at-e.on{stroke:var(--signal);opacity:.85}
.at-e.far{stroke-dasharray:8 8}
.at-e.inh{stroke-dasharray:3 6}
.at-e.dif{stroke-dasharray:7 7}
.at-ah{fill:var(--line-2);opacity:.5} .at-ah.on{fill:var(--signal);opacity:.85}
.at-tb{stroke:var(--line-2);stroke-width:4;stroke-linecap:round;opacity:.5} .at-tb.on{stroke:var(--signal);opacity:.85}
.at-n{--kc:var(--node-line);--kcf:transparent;transition:opacity .3s}
.at-n.k-lig{--kc:var(--k-lig);--kcf:var(--k-lig-a)} .at-n.k-rec{--kc:var(--k-rec);--kcf:var(--k-rec-a)} .at-n.k-prot{--kc:var(--k-prot);--kcf:var(--k-prot-a)} .at-n.k-msg{--kc:var(--k-msg);--kcf:var(--k-msg-a)} .at-n.k-gene{--kc:var(--k-gene);--kcf:var(--k-gene-a)} .at-n.k-eff{--kc:var(--k-eff);--kcf:var(--k-eff-a)}
.at-n .b{fill:var(--node);stroke:var(--line-2);stroke-width:2;stroke-dasharray:5 5}
.at-n .t{fill:var(--muted);font-size:17px;font-weight:800;text-anchor:middle;dominant-baseline:central}
.at-n.on .b{stroke:var(--kc);stroke-dasharray:none;fill:var(--node)}
.at-n.on .t{fill:var(--ink)}
.at-n .glow{fill:var(--kcf);stroke:none;opacity:.5}
.at-n.c1 .glow{opacity:.35} .at-n.c2 .glow{opacity:.7;filter:drop-shadow(0 0 6px var(--kc))} .at-n.c3 .glow{opacity:1;filter:drop-shadow(0 0 12px var(--kc))} .at-n.c4 .glow{opacity:1;filter:drop-shadow(0 0 20px var(--kc))}
.at-n.c3 .b,.at-n.c4 .b{stroke-width:3}
.at-n .cnt circle{fill:var(--kc);stroke:var(--panel);stroke-width:3}
.at-n .cnt text{fill:var(--panel);font-family:var(--f-mono);font-size:14px;font-weight:800;text-anchor:middle;dominant-baseline:central}
.at-n .cap{fill:var(--kc);font-size:13px;font-weight:800;text-anchor:middle}
.at-pin path{fill:var(--alarm);stroke:var(--panel);stroke-width:2}
.at-pin text{fill:#fff;font-family:var(--f-display);font-size:11px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.at-pin{transition:opacity .3s}
.atlas.focus .at-n:not(.hl),.atlas.focus .at-pin:not(.hl){opacity:.18}
.atlas.focus .at-n.hl .b{stroke-width:3.5}
.at-side{padding:1.1rem 1.2rem;display:grid;gap:.6rem;position:sticky;top:0}
.at-side h2{font-family:var(--f-display);font-weight:700;font-size:1.3rem;line-height:1.15}
.at-side p{font-size:.92rem;line-height:1.45;font-weight:700;color:var(--ink-2)}
.at-kpi{display:flex;gap:.6rem;align-items:center;padding:.6rem .7rem;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.at-kpi b{font-family:var(--f-mono);font-size:1.7rem;color:var(--signal)}
.at-kpi span{font-size:.82rem;font-weight:800;color:var(--ink-2);line-height:1.3}
.at-list{list-style:none;margin:0;padding:0;display:grid;gap:.3rem}
.at-list li{display:grid;grid-template-columns:auto 1fr;gap:.1rem .5rem;padding:.45rem .55rem;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);cursor:default;font-weight:800;font-size:.86rem;line-height:1.25}
.at-list li:hover,.at-list li:focus{border-color:var(--signal);outline:none}
.at-list .task{font-family:var(--f-mono);font-size:.72rem;color:var(--alarm);border:1px solid var(--alarm);border-radius:6px;padding:0 .3rem;align-self:start}
.at-list em{grid-column:2;font-style:normal;font-size:.74rem;color:var(--muted)}

/* ловушки */
.tr-wrap{display:grid;gap:1rem}
.tr-head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.4rem,2.4vw,2.2rem);margin-top:.3rem}
.tr-head p{font-size:1rem;font-weight:700;color:var(--ink-2);margin-top:.4rem;max-width:60rem;line-height:1.45}
.traps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;align-items:start}
.trap{display:flex;gap:.9rem;padding:1.1rem 1.1rem 1.2rem;animation:sheetin .5s cubic-bezier(.2,.9,.3,1) both}
.trap.ghost{border-style:dashed}
.tr-n{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;color:var(--alarm);text-shadow:0 0 1.4rem var(--alarm-a)}
.trap.ghost .tr-n{color:var(--muted);text-shadow:none}
.tr-b{display:grid;gap:.6rem;min-width:0;flex:1}
.tr-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.tr-t{font-weight:800;font-size:.95rem}
.tr-cnt{margin-left:auto;font-family:var(--f-body);font-weight:800;font-size:.8rem;color:var(--alarm)}

.tr-v.no .vn{background:var(--alarm);color:#fff}
.tr-v.no s{text-decoration-thickness:2px;text-decoration-color:var(--alarm)}
.tr-v.ok{background:var(--gold-a);border:1px solid var(--gold)}
.tr-v.ok .vn{background:var(--gold);color:var(--gold-ink)}
.tr-who{display:flex;gap:.3rem;flex-wrap:wrap;font-size:.82rem;font-weight:700}

.mk{width:.95rem;height:.95rem;flex:none;overflow:visible}

.lc-l{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}

.lc-tip{position:absolute;top:0;min-width:11rem;padding:.55rem .7rem;border-radius:12px;background:var(--panel-3);border:1px solid var(--line-2);box-shadow:0 .8rem 2rem var(--shadow);pointer-events:none;font-size:.84rem;font-weight:800;display:grid;gap:.25rem;z-index:3}

/* разбор: почему не другие версии */
.why{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}
