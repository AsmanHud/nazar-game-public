/* ===== живая клетка: компартменты, органеллы, фоновые молекулы ===== */
:root{--sp-ca:#FFE36E;--sp-na:#5EC8FF;--sp-cl:#FFB86B;--sp-glc:#DCE5F7;
  --blood:rgba(255,62,122,.075);--blood-l:rgba(255,62,122,.32);--rbc:#B8325C;--rbc-c:#7E1F3F;--cyto:rgba(134,168,255,.026);--lum:rgba(94,200,255,.045);
  --org:#2C3E66;--org-f:rgba(134,168,255,.05);--fat:rgba(255,193,77,.085);--fat-l:rgba(255,193,77,.32);--myo:rgba(229,139,255,.055);--myo-a:rgba(229,139,255,.09);--myo-z:rgba(229,139,255,.28);
  --fib:rgba(255,193,77,.17);--glyc:#3A5876;--chl:#B8964A;--pip2:#3DF59B;--amb-o:.6}
:root[data-look="day"]{--sp-ca:#9A7400;--sp-na:#1B78C2;--sp-cl:#B8650F;--sp-glc:#6B7894;
  --blood:rgba(216,30,88,.06);--blood-l:rgba(216,30,88,.3);--rbc:#E58AA6;--rbc-c:#C2476D;--cyto:rgba(59,111,216,.03);--lum:rgba(31,111,209,.05);
  --org:#B4C2DA;--org-f:rgba(59,111,216,.045);--fat:rgba(194,127,0,.07);--fat-l:rgba(194,127,0,.36);--myo:rgba(160,60,198,.045);--myo-a:rgba(160,60,198,.08);--myo-z:rgba(160,60,198,.26);
  --fib:rgba(194,127,0,.24);--glyc:#9FB4CC;--chl:#B98A2C;--pip2:#0E9F62;--amb-o:.78}
.dia .capil{fill:var(--blood)}
.dia .endo{fill:none;stroke:var(--blood-l);stroke-width:1.5}
.dia .endon{fill:var(--blood-l);opacity:.55}
.dia .rbcb{fill:var(--rbc);opacity:.7}
.dia .rbcc{fill:var(--rbc-c);opacity:.85}
.dia .rbc{animation:rbcflow var(--t) linear var(--dl) infinite}
@keyframes rbcflow{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(calc(var(--fx) * .25),1.6px) rotate(5deg)}50%{transform:translate(calc(var(--fx) * .5),0) rotate(-3deg)}75%{transform:translate(calc(var(--fx) * .75),-1.6px) rotate(4deg)}100%{transform:translate(var(--fx),0) rotate(0)}}
.dia .cyto{fill:var(--cyto)}
.dia .gap{fill:var(--z-out)}
.dia .lum{fill:var(--lum)}
.dia .fib{fill:none;stroke:var(--fib);stroke-width:1.2;stroke-linecap:round}
.dia .apc,.dia .term{fill:var(--org-f)}
.dia .apcm,.dia .termm{fill:none;stroke:var(--mem-head);stroke-width:5;stroke-linejoin:round}
.dia .az{fill:none;stroke:var(--mem-head);stroke-width:2.4;stroke-linejoin:round}
.dia .bl{fill:none;stroke:var(--line-2);stroke-width:1.5;stroke-dasharray:2 5}
.dia .fat{fill:var(--fat)}
.dia .orgl{font-family:var(--f-display);font-size:10px;font-weight:600;letter-spacing:.14em;fill:var(--zone);opacity:.85}
.dia .myo{fill:var(--myo)} .dia .myoa{fill:var(--myo-a)} .dia .myoz{fill:none;stroke:var(--myo-z);stroke-width:1.5}
.dia .fold{fill:none;stroke:var(--mem-head);stroke-width:3;opacity:.55}
.dia .mito{fill:var(--org-f);stroke:var(--org);stroke-width:1.8}
.dia .mitoc{fill:none;stroke:var(--org);stroke-width:1.3;stroke-linejoin:round}
.dia .drop{fill:var(--fat)}
.dia .actin{fill:none;stroke:var(--k-prot);stroke-width:1;opacity:.13}
.dia .glyc{fill:none;stroke:var(--glyc);stroke-width:1.3;stroke-linecap:round}
.dia .glycs{fill:var(--glyc)}
.dia .chl{fill:var(--chl);opacity:.55}
.dia .pip2{fill:var(--pip2);opacity:.3}
.dia .tj rect{fill:var(--panel-3);stroke:var(--zone);stroke-width:1.4}
.dia .tj path{fill:none;stroke:var(--zone);stroke-width:1.4}
.dia .mv{fill:var(--mem-tail);stroke:var(--mem-head);stroke-width:2}
.dia .mvc{fill:none;stroke:var(--k-prot);stroke-width:1;opacity:.3}
.dia .npore{fill:var(--nuc);stroke:var(--nuc-line);stroke-width:1.2}
.dia .nucleolus{fill:var(--nuc-line);opacity:.3}
.dia .chrom{fill:none;stroke:var(--k-gene);stroke-width:1.4;opacity:.22;stroke-linecap:round}
.dia .erz2{fill:none;stroke:var(--er-line);stroke-width:1;opacity:.5}
.dia .erf{fill:none;stroke:var(--er-line);stroke-width:1.3;opacity:.45}
/* фоновые молекулы: дрейф, «потоп» и исчезновение посредника при вскрытии */
.sp-ca{--spc:var(--sp-ca)} .sp-na{--spc:var(--sp-na)} .sp-cl{--spc:var(--sp-cl)} .sp-glc{--spc:var(--sp-glc)}
.sp-camp,.sp-ip3,.sp-dag{--spc:var(--k-msg)}
.sp-pep,.sp-gly,.sp-cat,.sp-his,.sp-ster,.sp-ins,.sp-ligy,.sp-ach,.sp-epo,.sp-ves,.sp-gran{--spc:var(--k-lig)}
.sp-ven{--spc:var(--k-ab)} .sp-glut{--spc:var(--k-rec)}
.ambl .ion,.amb-leg .ion{fill:var(--spc)}
.ambl .sm,.amb-leg .sm{fill:none;stroke:var(--spc);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.ambl .smf,.amb-leg .smf{fill:var(--spc)}
.ambl .vesm{fill:var(--org-f);stroke:var(--mem-head);stroke-width:2}
.ambl .granm{fill:var(--fat);stroke:var(--mem-head);stroke-width:2}

    why:'Омализумаб — антитело к домену Cε3 IgE: перехватывает свободный IgE до рецептора, число FcεRI на тучных клетках со временем падает. В остром приступе первым вводят адреналин в мышцу.'},
  deb:{task:'Пациент после укуса пчелы — генерализованная крапивница, бронхоспазм, гипотония. 1) К какому типу рецепторов относится высокоаффинный рецептор IgE (FcεRI)? Опишите его структуру. 2) Что происходит после связывания антигена с IgE, уже сидящим на FcεRI? 3) Опишите внутриклеточный сигнальный каскад, начиная с Lyn- и Syk-киназ. 4) Какие медиаторы выделяются и как они вызывают клинические проявления (через какие рецепторы)? 5) Какой препарат-антагонист IgE используется для профилактики и на каком уровне он действует?',
    points:['Тип: FcεRI — иммунорецептор, рецептор без собственной киназы, связанный с цитоплазматическими тирозинкиназами (семейство рецепторов с ITAM). На тучных клетках и базофилах — тетрамер αβγ₂: α-цепь связывает Fc-фрагмент IgE (домен Cε3) с очень высокой аффинностью (Kd около 10⁻¹⁰ М), β-цепь пересекает мембрану 4 раза, γ-цепи — димер; β и γ несут мотивы ITAM.',
      'После сенсибилизации IgE уже «сидит» на FcεRI. Поливалентный аллерген связывает два и больше соседних IgE и сшивает рецепторы — они собираются в кластеры в липидных рафтах. Одиночное связывание сигнала не даёт, нужно именно сшивание.',
      'Каскад: Lyn (киназа семейства Src, связана с β-цепью) фосфорилирует ITAM на β и γ. Syk садится SH2-доменами на фосфо-ITAM γ-цепи, фосфорилируется и активируется. Syk фосфорилирует адаптеры LAT и SLP-76, к ним присоединяется PLCγ1 → IP3 и ДАГ. IP3 выпускает Ca²⁺ из ЭПР, затем открывается SOCE (STIM1 / Orai1). ДАГ и Ca²⁺ включают ПКС. Параллельно PI3K (через Fyn и Gab2) и Ras–MAPK → cPLA2.',
      'Медиаторы: за секунды–минуты — дегрануляция (Ca²⁺ и ПКС запускают слияние гранул через SNARE): гистамин, триптаза, химаза, гепарин, TNF-α. За минуты — синтез из арахидоновой кислоты: лейкотриены C4 / D4 / E4, простагландин D2, PAF. Через часы — цитокины (ИЛ-4, ИЛ-5, ИЛ-13, TNF-α), поздняя фаза.',
      'Клиника по рецепторам: гистамин → H1 (Gq) эндотелия — NO, расширение сосудов и проницаемость: волдыри, отёк, гипотония; H1 гладких мышц бронхов — бронхоспазм; H2 — тахикардия, секреция. Лейкотриены → CysLT1 — сильный длительный бронхоспазм, слизь, проницаемость. PGD2 (DP-рецепторы) и PAF усиливают вазодилатацию и бронхоспазм.',
      'Омализумаб — гуманизированное моноклональное антитело к домену Cε3 IgE. Связывает свободный IgE и не даёт ему сесть на FcεRI (действует до рецептора, на уровне лиганда). Рецепторов на тучных клетках и базофилах со временем становится меньше. С IgE, уже сидящим на рецепторе, не связывается и тучные клетки не активирует. Для профилактики при аллергии на яд основа — аллерген-специфическая иммунотерапия, в остром приступе — адреналин в мышцу.']}

    s+=hel(28,-20,20,5)+hel(36,-20,20,5)+P('M28 -17L36 -17','l');s+=P('M28 20L27 50M36 20L38 50','l')+itam(27,38)+itam(38,38);

/* ---- иконки для молекул (центр в 0,0, ~22×22) ---- */
const hexPath=(cx,cy,r,rot)=>{let d='';for(let k=0;k<6;k++){const a=(rot||Math.PI/6)+k*Math.PI/3;d+=(k?'L':'M')+r1(cx+Math.cos(a)*r)+' '+r1(cy+Math.sin(a)*r)}return d+'Z'};
const pentPath=(cx,cy,r,rot)=>{let d='';for(let k=0;k<5;k++){const a=(rot||-Math.PI/2)+k*2*Math.PI/5;d+=(k?'L':'M')+r1(cx+Math.cos(a)*r)+' '+r1(cy+Math.sin(a)*r)}return d+'Z'};
const IC={
  peptide:()=>{const pts=[[-9,4],[-5,-4],[0,4],[5,-4],[9,4]];return P('M'+pts.map(p=>p.join(' ')).join('L'),'ic')+pts.map(p=>C(p[0],p[1],2.6,'icf')).join('')},
  protein:()=>P('M-9 6C-12 -2 -4 -10 2 -6C8 -2 -2 2 4 6C10 10 12 -4 8 -8','ic'),
  insulin:()=>P('M-10 -5H10M-8 5H10M-4 -5V5M5 -5V5','ic')+[-10,-3,4,10].map(x=>C(x,-5,2,'icf')).join('')+[-8,0,8].map(x=>C(x,5,2,'icf')).join(''),
  glyco:()=>E_(-4,2,6,7,'ic')+E_(5,2,6,7,'ic')+P('M0 -5V-10M0 -10L-4 -13M0 -10L4 -13','ic')+C(-4,-13,1.6,'icf')+C(4,-13,1.6,'icf'),
  helix4:()=>[-8,-3,2,7].map((x,i)=>`<rect class="ic" x="${x-2}" y="${-8+(i%2)*2}" width="4.5" height="15" rx="2"/>`).join('')+P('M9 -8l3 -3','ic'),
  steroid:()=>P(hexPath(-8,3,4.6)+hexPath(0,-2,4.6)+hexPath(8,3,4.6)+pentPath(12,-6,3.8,0),'ic'),
  catechol:()=>P(hexPath(-4,2,6),'ic')+P('M-9 -4L-12 -7M-4 -5L-4 -9M2 2L8 -2L12 1','ic')+C(12,1,1.8,'icf'),
  salig:()=>P(hexPath(-4,2,6),'ic')+P('M-9 -4L-12 -7M-4 -4L-4 -8L-1 -11M2 2L8 -2L12 1','ic')+C(12,1,1.8,'icf')+C(-1,-11,1.6,'icf'),
  imid:()=>P(pentPath(-5,1,6),'ic')+P('M1 -2L7 -4L11 -1','ic')+C(11,-1,1.8,'icf'),
  ach:()=>P('M-11 2L-6 -2L-1 2L4 -2','ic')+C(8,-1,4.5,'ic')+`<text class="ict" x="8" y="0">N</text>`,
  ion:()=>C(-5,2,5,'ic')+C(6,-3,4,'ic')+P('M-7 2H-3M-5 0V4M4 -3H8M6 -5V-1','ic'),
  camp:()=>P(hexPath(-5,0,5.5)+pentPath(4.5,0,4.6,Math.PI),'ic')+C(-5,10,3,'ic'),
  ip3:()=>P(hexPath(0,0,6.5),'ic')+[[-9,-6],[9,-6],[0,10]].map(p=>C(p[0],p[1],2.6,'icf')).join(''),
  dag:()=>C(-9,-5,1.8,'icf')+C(-9,0,1.8,'icf')+C(-9,5,1.8,'icf')+P('M-7 -5l4 3l4 -3l4 3l4 -3M-7 0l4 3l4 -3l4 3l4 -3','ic'),
  venom:()=>P('M0 -10C4 -4 8 0 8 4A8 8 0 0 1 -8 4C-8 0 -4 -4 0 -10Z','ic')+C(-2,4,1.6,'icf')+C(3,2,1.6,'icf'),
  kidney:()=>P('M2 -10C-8 -12 -12 -2 -10 4C-8 11 2 12 4 6C5 3 2 1 2 -2C2 -5 6 -6 6 -8C6 -10 4 -10 2 -10Z','ic'),
  nerve:()=>P('M-12 4H-6L-3 -9L1 9L4 4H12','ic'),
  c_gpcr:()=>[-8,-4,0,4,8].map(x=>`<rect class="ic" x="${x-1.4}" y="-7" width="2.8" height="14" rx="1.4"/>`).join(''),
  c_chan:()=>`<rect class="ic" x="-10" y="-8" width="7" height="16" rx="3"/><rect class="ic" x="3" y="-8" width="7" height="16" rx="3"/>`+P('M0 -9V9','ic dash'),
  c_rtk:()=>C(-4,-6,3,'ic')+C(4,-6,3,'ic')+P('M-4 -3V3M4 -3V3','ic')+E_(-4,7,3.5,3,'ic')+E_(4,7,3.5,3,'ic')

/* ---- формы-карточки (цитоплазма, ядро) ---- */
function card(n){
  const a=n.w/2,b=n.h/2,g=n.g;let s='',tx=0,ty=0;
  if(g==='kinase'){s=E_(-a*.3,-b*.18,a*.66,b*.8)+E_(a*.12,b*.12,a*.86,b*.86);tx=a*.08;ty=b*.12}
  else if(g==='enzyme'){const r=Math.min(14,b);s=`<path class="b" d="M${r1(-a+r)} ${r1(-b)}H${r1(a-26)}L${r1(a-14)} ${r1(-b+10)}L${r1(a)} ${r1(-b+12)}V${r1(b-r)}Q${r1(a)} ${r1(b)} ${r1(a-r)} ${r1(b)}H${r1(-a+r)}Q${r1(-a)} ${r1(b)} ${r1(-a)} ${r1(b-r)}V${r1(-b+r)}Q${r1(-a)} ${r1(-b)} ${r1(-a+r)} ${r1(-b)}Z"/>`+C(a-12,-b+12,2.4,'f')}
  else if(g==='tf'){s=E_(-a*.42,0,a*.6,b)+E_(a*.42,0,a*.6,b)}
  else if(g==='arrestin'){s=E_(-a*.44,2,a*.58,b*.86,'b',-9)+E_(a*.44,-2,a*.58,b*.86,'b',9)}
  else if(g==='nr'){s=P(`M${r1(-a*.36)} ${r1(-b*.34)}C${r1(-a*.3)} ${r1(-b*1.04)} ${r1(a*.56)} ${r1(-b*1.04)} ${r1(a*.62)} ${r1(-b*.34)}`,'k hsp')+`<text class="tiny" x="${r1(a*.13)}" y="${r1(-b*.8)}">HSP90</text>`+E_(-a*.78,b*.3,a*.2,b*.36)+C(-a*.84,b*.04,3.4,'zf')+C(-a*.72,b*.52,3.4,'zf')+E_(a*.12,b*.22,a*.84,b*.72);tx=a*.12;ty=b*.24}
  else if(g==='dna'){s=`<rect class="b" x="${r1(-a)}" y="${r1(-b)}" width="${n.w}" height="${n.h}" rx="12"/>`;let p1='',p2='',rg='';for(let x=-a+10;x<=a-10;x+=2){const t=(x+a)/8;p1+=(p1?'L':'M')+r1(x)+' '+r1(b-9+Math.sin(t)*4);p2+=(p2?'L':'M')+r1(x)+' '+r1(b-9-Math.sin(t)*4)}for(let x=-a+12;x<a-10;x+=7)rg+=`M${r1(x)} ${r1(b-12)}V${r1(b-6)}`;s+=P(p1,'l dna')+P(p2,'l dna')+P(rg,'l thin');ty=-5}
  else if(g==='adaptor'){s=`<rect class="b" x="${r1(-a)}" y="${r1(-b)}" width="${r1(n.w-12)}" height="${n.h}" rx="13"/><rect class="b" x="${r1(a-16)}" y="-7" width="16" height="14" rx="5"/>`;tx=-6}
  else if(g==='jak'){s=E_(-a*.62,-b*.24,a*.34,b*.56,'b back2')+E_(-a*.42,b*.16,a*.5,b*.76,'b back2')+E_(a*.3,-b*.24,a*.34,b*.56)+E_(a*.46,b*.16,a*.52,b*.76);ty=b*.16;tx=a*.4}
  else if(g==='vesicle'){s=E_(0,0,a,b)+E_(0,0,a-6,b-6,'l')}
  else if(g==='granule'){s=`<rect class="b" x="${r1(-a)}" y="${r1(-b)}" width="${n.w}" height="${n.h}" rx="16"/>`;for(let k=0;k<14;k++){const t=k/14*Math.PI*2;s+=C(Math.cos(t)*(a-8),Math.sin(t)*(b-7),2.6,'f')}}
  else if(g==='eff'){s=`<rect class="b eff" x="${r1(-a)}" y="${r1(-b)}" width="${n.w}" height="${n.h}" rx="13"/>`}
  else if(n.icon){s=`<rect class="b" x="${r1(-a)}" y="${r1(-b)}" width="${n.w}" height="${n.h}" rx="${r1(Math.min(b,23))}"/>`+`<g transform="translate(${r1(-a+20)} 0)">${(IC[g]||IC.protein)()}</g>`;tx=13}
  else{s=`<rect class="b" x="${r1(-a)}" y="${r1(-b)}" width="${n.w}" height="${n.h}" rx="13"/>`}
  const y0=ty-(n.lines.length-1)*12;
  return s+n.lines.map((l,i)=>`<text class="tx" x="${r1(tx)}" y="${r1(y0+i*24)}">${esc(l)}</text>`).join('');
}
function glyph(n,o){
  if(n.g==='plc_m'){const a=n.cw/2,h=n.ch;return `<rect class="b" x="${r1(-a)}" y="14" width="${n.cw}" height="${h-2}" rx="18"/>`+C(-a+12,14,7)+C(a-14,15,6)+`<text class="tx" x="0" y="${r1(12+h/2+1)}">${esc(ltxt(n.label))}</text>`}
  if(n.mem){
    const body=n.g==='gpcr'?MG.gpcr(false):n.g==='gpcr_lrr'?MG.gpcr(true):n.g==='gprot'?MG.gprot(n.label):n.g==='lgic'?MG.lgic(false):n.g==='nachr'?MG.lgic(true):MG[n.g]();
    if(n.g==='gprot'||(o&&o.noPill))return body;
    return body+`<rect class="pl" x="${r1(-n.pw/2)}" y="${n.py}" width="${r1(n.pw)}" height="26" rx="13"/><text class="pt" x="0" y="${n.py+13.5}">${esc(n.pt)}</text>`;
  }
  return card(n);
}

/* ---- схема целиком ---- */
let UIDN=0;
function diagram(d,G,pins,cls){
  const u='l'+(++UIDN);let z='';
  const A=typeof CELLART!=='undefined'?CELLART.build(d,G,G.cid,pins):null;
  z+=`<defs><pattern id="${u}o" width="15" height="50" patternUnits="userSpaceOnUse" x="0" y="130"><line class="mem-t" x1="5.5" y1="11" x2="5.5" y2="23"/><line class="mem-t" x1="9.5" y1="11" x2="9.5" y2="23"/><circle class="mem-h" cx="7.5" cy="7" r="5"/></pattern>`+
    `<pattern id="${u}i" width="15" height="50" patternUnits="userSpaceOnUse" x="0" y="130"><line class="mem-t" x1="5.5" y1="27" x2="5.5" y2="39"/><line class="mem-t" x1="9.5" y1="27" x2="9.5" y2="39"/><circle class="mem-h" cx="7.5" cy="43" r="5"/></pattern>`+
    `<pattern id="${u}w" width="16" height="9" patternUnits="userSpaceOnUse" x="0" y="0"><circle class="mem-h" cx="3" cy="4.5" r="2.6"/><circle class="mem-h" cx="13" cy="4.5" r="2.6"/><line class="mem-t" x1="5.5" y1="3.4" x2="10.5" y2="3.4"/><line class="mem-t" x1="5.5" y1="5.6" x2="10.5" y2="5.6"/></pattern>${A?A.defs:''}</defs>`;
  z+=`<rect class="z-out" x="-10" y="-40" width="920" height="170"/>`;
  if(A)z+=A.back;
  const mt=esc(A&&A.memTip||'Мембрана|Двойной слой фосфолипидов');const leaf=(x,w)=>`<rect class="memb leaf-o" data-tip="${mt}" x="${x}" y="130" width="${w}" height="25" fill="url(#${u}o)"/><rect class="memb leaf-i" data-tip="${mt}" x="${x}" y="155" width="${w}" height="25" fill="url(#${u}i)"/>`;
  if(A&&A.div&&d.divider){const g=A.gw,dv=d.divider;z+=leaf(-10,dv-g+10)+leaf(dv+g,910-dv-g);
    z+=`<rect class="memb wall" x="${dv-g-16}" y="178" width="16" height="400" fill="url(#${u}w)"/><rect class="memb wall" x="${dv+g}" y="178" width="16" height="400" fill="url(#${u}w)"/>`}
  else z+=leaf(-10,920);
  if(A)z+=A.front;
  if(d.nucleus){const [cx,cy,rx,ry]=d.nucleus;z+=`<g data-tip="Ядро|Двойная оболочка с порами: через них в ядро входят транскрипционные факторы, а из ядра выходит мРНК"><ellipse class="nucl" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/><ellipse class="nucl2" cx="${cx}" cy="${cy}" rx="${rx-7}" ry="${ry-7}"/>`;
    const per=Math.PI*(3*(rx+ry)-Math.sqrt((3*rx+ry)*(rx+3*ry))),np=Math.max(10,Math.round(per/36));
    for(let k=0;k<np;k++){const t=(k+.5)/np*Math.PI*2,px=cx+Math.cos(t)*(rx-3.5),py=cy+Math.sin(t)*(ry-3.5),na=Math.atan2(Math.sin(t)/ry,Math.cos(t)/rx)*180/Math.PI;z+=`<rect class="npore" x="-2.8" y="-6.5" width="5.6" height="13" rx="2.4" transform="translate(${r1(px)} ${r1(py)}) rotate(${r1(na-90)})"/>`}
    z+=`<circle class="nucleolus" cx="${r1(cx-rx*.52)}" cy="${r1(cy-ry*.18)}" r="${r1(Math.min(rx,ry)*.2)}"/>`;
    for(let k=0;k<5;k++){const t=k/5*Math.PI*2+.7;z+=`<path class="chrom" d="M${r1(cx+Math.cos(t)*(rx-18))} ${r1(cy+Math.sin(t)*(ry-16))}q${r1(Math.sin(t)*10)} ${r1(-Math.cos(t)*8)} ${r1(Math.sin(t)*20)} ${r1(-Math.cos(t)*4)}"/>`}
    z+=`<text class="zl" x="${cx}" y="${cy+ry-14}" text-anchor="middle">ЯДРО</text></g>`}
  if(d.er){const [x,y,w,h]=d.er;z+=`<g data-tip="ЭПР|Эндоплазматический ретикулум — внутреннее депо Ca²⁺ клетки (≈ 0,5 мМ)"><rect class="erz" x="${x}" y="${y}" width="${w}" height="${h}" rx="28"/><rect class="erz2" x="${x+5}" y="${y+5}" width="${w-10}" height="${h-10}" rx="24"/>`;
    z+=`<path class="erf" d="M${x+26} ${y+h*.36}C${x+w*.3} ${y+h*.2} ${x+w*.55} ${y+h*.5} ${x+w-26} ${y+h*.34}M${x+26} ${y+h*.66}C${x+w*.35} ${y+h*.82} ${x+w*.6} ${y+h*.52} ${x+w-26} ${y+h*.7}"/>`;
    const lab=d.erLabel==null?(A&&A.erLabel||'ЭПР · ДЕПО Ca²⁺'):d.erLabel;if(lab)z+=`<text class="zl" x="${x+16}" y="${y+h-14}">${esc(lab)}</text>`;z+='</g>'}
  if(d.divider){if(!(A&&A.div))z+=`<line class="divl" x1="${d.divider}" y1="192" x2="${d.divider}" y2="556"/>`;z+=`<text class="zl" x="14" y="548">${esc(d.left||'')}</text><text class="zl" x="${d.divider+(A&&A.div?A.gw+14:14)}" y="548">${esc(d.right||'')}</text>`}
  const topT=A&&A.top||d.top;
  if(topT&&!(A&&A.noTop))z+=`<text class="zl" x="14" y="-12">${esc(topT)}</text>`;
  if(A)A.labs.forEach(([x,y,t])=>z+=`<text class="zl" x="${x}" y="${y}">${esc(t)}</text>`);
  if(d.bottom)z+=`<text class="zl" x="14" y="548">${esc(d.bottom)}</text>`;
  if(A)z+=A.leg+`<g class="ambl">${A.amb}</g>`;
  let ed='';
  for(const e of G.E){const ux=(e.x2-e.x1)/e.len,uy=(e.y2-e.y1)/e.len;
    if(e.t==='inh'){const px=-uy*12,py=ux*12;ed+=`<line class="ed inh" data-e="${e.k}" x1="${r1(e.x1)}" y1="${r1(e.y1)}" x2="${r1(e.x2)}" y2="${r1(e.y2)}"/><line class="tb" data-e="${e.k}" x1="${r1(e.x2+px)}" y1="${r1(e.y2+py)}" x2="${r1(e.x2-px)}" y2="${r1(e.y2-py)}"/>`;continue}
    const ex=e.x2-ux*12,ey=e.y2-uy*12,bx=e.x2-ux*15,by=e.y2-uy*15,px=-uy*7.5,py=ux*7.5;
    ed+=`<line class="ed ${e.t}" data-e="${e.k}" x1="${r1(e.x1)}" y1="${r1(e.y1)}" x2="${r1(ex)}" y2="${r1(ey)}"/><polygon class="ah" data-e="${e.k}" points="${r1(e.x2)},${r1(e.y2)} ${r1(bx+px)},${r1(by+py)} ${r1(bx-px)},${r1(by-py)}"/>`}
  let nd='';
  for(const id in G.N){const n=G.N[id];const hb=n.cb;let hh=0;for(const ch of id)hh=(hh*31+ch.charCodeAt(0))>>>0;nd+=`<g class="nd k-${n.kind} g-${n.g}${n.mem?' mem':''}" data-n="${id}" data-act="node" transform="translate(${n.x} ${n.y})"><rect class="hit" x="${r1(hb[0]-n.x)}" y="${r1(hb[1]-n.y)}" width="${r1(hb[2]-hb[0])}" height="${r1(hb[3]-hb[1])}"/><g class="nd-in"><g class="nd-idle" style="--it:${(5.5+hh%30/10).toFixed(1)}s;--id:-${(hh%70/10).toFixed(1)}s">${glyph(n)}</g></g></g>`}

  return `<svg class="dia ${cls||''}" data-cid="${G.cid||''}" viewBox="0 -36 900 596" role="img" aria-label="Схема сигнального пути">${z}<g class="edges">${ed}</g><g class="parts"></g><g class="nodes">${nd}</g><g class="fxl"></g><g class="pins">${pn}</g></svg>`;
}
function applyMoves(){
  if(typeof NODE_MOVE==='undefined')return;
  const all=CASES.map(c=>[c.id,c.dia]);if(typeof FINALE!=='undefined')all.push(['finale',FINALE.dia]);
  all.forEach(([id,d])=>{const mv=NODE_MOVE[id];if(!mv)return;for(const k in mv){if(d.n[k]){d.n[k][0]=mv[k][0];d.n[k][1]=mv[k][1]}}});
}
applyMoves();
return {node,glyph,geom,pinPos,diagram,clipTo,IC,MG,hexPath,pentPath,esc,tw};
})();

/* ===== Компартменты клетки и «живые» молекулы =====
   out:   blood — капилляр с эритроцитами над интерстицием; tissue — интерстиций; medium — питательная среда (культура);
          synapse — нервное окончание и щель; apc — дендритная клетка над Т-клеткой

/* план вскрытия: где сломан сигнал */
function revealPlan(c,G){
  const b=c.brk,E=G.E,act=E.filter(e=>e.t!=='inh'),out={},inn={};
  act.forEach(e=>{(out[e.a]=out[e.a]||[]).push(e);(inn[e.b]=inn[e.b]||[]).push(e)});
  const walk=(start,adj,key)=>{const seen=new Set(),st=[...start];while(st.length){const x=st.pop();for(const e of adj[x]||[]){const y=e[key];if(!seen.has(y)){seen.add(y);st.push(y)}}}return seen};
  const desc=s=>walk(s,out,'b'),anc=s=>walk(s,inn,'a');
  const nc={},ec={},em={};for(const id in G.N)nc[id]='';for(const e of E){ec[e.k]='';em[e.k]='amb'}
  let tag=null,crack=null,pulse=null;
  const nodeTag=(id,text,gold)=>{const n=G.N[id],b=n.cb,tw=[...text].length*9.6+26;tag={x:Math.min(n.cx,b[2]-25-tw/2),y:Math.max(-20,b[1]-22),text,gold}};
  const crackOn=(n,k)=>{const [x0,y0,x1,y1]=n.cb,cx=(x0+x1)/2,cy=(y0+y1)/2,w=x1-x0,h=y1-y0;if(n.mem)return {d:`M${x0+10} ${y0+8} L${cx-w*(k||.17)} ${cy+2} L${cx+w/8} ${cy-6} L${x1-10} ${y1-8}`};const q=Math.min(w*.22,34);return {d:`M${x1-3} ${y0+h*.28} L${x1-q*.55} ${y0+h*.5} L${x1-q*.3} ${y0+h*.64} L${x1-q} ${y1-2}`}};
  let bn=null,be=null;
  if(b.type==='path'){
    for(const id in G.N)nc[id]='dim';for(const e of E){ec[e.k]='dim';em[e.k]='off'}
    b.nodes.forEach(id=>nc[id]='lit');nc[b.nodes[1]]='good';
    for(const e of E)if(b.nodes.includes(e.a)&&b.nodes.includes(e.b)){ec[e.k]='lit';em[e.k]='lit'}
    nodeTag(b.nodes[1],b.tag,true);bn=b.nodes[1];
  }else if(b.type==='block'){
    let up,down;
    if(b.at.includes('>')){const [a,bb]=b.at.split('>');be=E.find(e=>e.a===a&&e.b===bb);up=anc([a]);up.add(a);down=desc([bb]);down.add(bb)}
    else{bn=b.at;up=anc([bn]);down=desc([bn])}
    up.forEach(id=>nc[id]='lit');down.forEach(id=>nc[id]='dim');
    for(const e of E){
      if(up.has(e.a)&&(up.has(e.b)||e.b===bn)){ec[e.k]='lit';em[e.k]='lit'}
      else if(down.has(e.a)||down.has(e.b)||e.a===bn){ec[e.k]='dim';em[e.k]='off'}
    }
    if(be){ec[be.k]='brk';em[be.k]='off';const mx=(be.x1+be.x2)/2,my=(be.y1+be.y2)/2,ux=(be.x2-be.x1)/be.len,uy=(be.y2-be.y1)/be.len,px=-uy,py=ux;
      crack={d:`M${mx-px*22-ux*6} ${my-py*22-uy*6} L${mx-px*8+ux*6} ${my-py*8+uy*6} L${mx+px*6-ux*6} ${my+py*6-uy*6} L${mx+px*22+ux*6} ${my+py*22+uy*6}`};
      tag={x:mx+px*70,y:my+py*0-0,text:b.tag}; if(Math.abs(uy)>.7){tag={x:mx+86,y:my,text:b.tag}}else{tag={x:mx,y:my-30,text:b.tag}} }
    else{nc[bn]='brk';crack=crackOn(G.N[bn]);nodeTag(bn,b.tag)}
  }else if(b.type==='over'){
    const X=b.at,down=desc([X]),up=anc([X]);nc[X]='brk';down.forEach(id=>nc[id]='flood');up.forEach(id=>{if(!down.has(id))nc[id]='lit'});
    for(const e of E){if((e.a===X||down.has(e.a))&&down.has(e.b)){ec[e.k]='flood';em[e.k]='flood'}else if(up.has(e.a)&&(up.has(e.b)||e.b===X)){ec[e.k]='lit';em[e.k]='lit'}}
    pulse=X;nodeTag(X,b.tag);bn=X;
  }else if(b.type==='brakeoff'){
    const P=b.at,T=b.target,down=desc([T]);down.add(T);const up=anc([T]);nc[P]='brk';down.forEach(id=>nc[id]='flood');up.forEach(id=>{if(!down.has(id)&&id!==P)nc[id]='lit'});
    for(const e of E){if(down.has(e.a)&&down.has(e.b)){ec[e.k]='flood';em[e.k]='flood'}else if(up.has(e.a)&&(up.has(e.b)||e.b===T)){ec[e.k]='lit';em[e.k]='lit'} if(e.a===P&&e.t==='inh')ec[e.k]='brk'}
    crack=crackOn(G.N[P],.06);nodeTag(P,b.tag);bn=P;
  }else if(b.type==='brakeon'){
    const P=b.at,T=b.target,down=desc([T]);down.add(T);const up=anc([P]);anc([T]).forEach(id=>{if(!down.has(id))up.add(id)});
    nc[P]='brk';down.forEach(id=>nc[id]='dim');up.forEach(id=>{if(id!==P)nc[id]='lit'});
    for(const e of E){if(down.has(e.a)){ec[e.k]='dim';em[e.k]='off'} if(up.has(e.a)&&(up.has(e.b)||e.b===P||e.b===T)){ec[e.k]='lit';em[e.k]='lit'} if(e.a===P&&e.t==='inh')ec[e.k]='brk'}
    pulse=P;nodeTag(P,b.tag);bn=P;
  }else if(b.type==='low'){
    const X=b.at,down=desc([X]);nc[X]='brk';down.forEach(id=>nc[id]='dim');
    for(const e of E){if(e.a===X||down.has(e.a)){ec[e.k]='dim';em[e.k]='sparse'}}
    nodeTag(X,b.tag);bn=X;
  }
  if(b.type!=='path'){for(const id in nc)if(!nc[id])nc[id]='side';for(const e of E)if(!ec[e.k]){ec[e.k]='side';em[e.k]='off'}}
  const R={nc,ec,em,tag,crack,pulse,bn,be,type:b.type};placeTag(R,G,c);return R;
}
/* метка поломки и значок механизма: ищем место, где они не закрывают узлы и флажки */
function placeTag(R,G,c){
  let anc=null;
  if(R.bn){anc=G.N[R.bn].cb;R.badge=[clamp(anc[0]+4,18,882),clamp(anc[1]+4,-18,540)]}
  else if(R.be){const e=R.be,mx=(e.x1+e.x2)/2,my=(e.y1+e.y2)/2;anc=[mx-3,my-3,mx+3,my+3];R.badge=[clamp(mx+(e.y2-e.y1)/e.len*34,18,882),clamp(my-(e.x2-e.x1)/e.len*34,-18,540)]}
  if(!R.tag||!anc)return;
  const w=TAGW(R.tag.text),h=26,[x0,y0,x1,y1]=anc,cx=(x0+x1)/2,cy=(y0+y1)/2;
  const obs=[];for(const id in G.N)obs.push(G.N[id].box);
  const heavy=[];(c.vers||[]).forEach(v=>{try{const [px,py]=GLY.pinPos(G,v[0]);heavy.push([px-17,py-17,px+17,py+17])}catch(e){}});
  if(R.badge)heavy.push([R.badge[0]-16,R.badge[1]-16,R.badge[0]+16,R.badge[1]+16]);
  const ov=(a,b)=>Math.max(0,Math.min(a[2],b[2])-Math.max(a[0],b[0]))*Math.max(0,Math.min(a[3],b[3])-Math.max(a[1],b[1]));
  const C=[];[y0-20,y0-48,cy-30,cy,cy+30,y1+20,y1+48].forEach(y=>[cx,x1+w/2+12,x0-w/2-12,x1+w/2-24,x0-w/2+24].forEach(x=>{if(y>y0-15&&y<y1+15&&x>x0-w/2&&x<x1+w/2)return;C.push([x,y])}));
  let best=null;C.forEach(([x,y])=>{const r=[x-w/2,y-h/2,x+w/2,y+h/2];let sc=Math.hypot(x-cx,y-cy)*3;obs.forEach(o=>sc+=ov(r,o));heavy.forEach(o=>sc+=4*ov(r,o));if(r[0]<4||r[2]>896||r[1]<-34||r[3]>556)sc+=1e6;if(!best||sc<best.sc)best={x,y,sc}});
  R.tag.x=best.x;R.tag.y=best.y;
}
const TAGW=t=>[...t].length*11.2+30;
const BADGE={over:'M2 -9L-5 1H0L-2 9L5 -1H0Z',block:'M-5 -5L5 5M5 -5L-5 5',low:'M0 -7V6M-5 1L0 6L5 1',brakeoff:'M-7 -4H-2M2 -4H7M0 0V7',brakeon:'M-5 -1H5V7H-5ZM-3 -1V-4A3 3 0 0 1 3 -4V-1',path:'M-5 0L-1 4L6 -4'};
function revealClasses(svg,R){

  svg.querySelectorAll('.nd').forEach(g=>{g.classList.remove('dim','lit','brk','flood','good','side');const k=R.nc[g.dataset.n];if(k)g.classList.add(k)});
  svg.querySelectorAll('[data-e]').forEach(el=>{el.classList.remove('dim','lit','brk','flood','side');const k=R.ec[el.dataset.e];if(k)el.classList.add(k)});

function revealFx(svg,R,G,animate){
  let fx='';

  if(R.crack)fx+=`<path class="crack" d="${R.crack.d}"/>`;

const MON={cv:null,ctx:null,w:0,h:0,x:0,lx:0,ly:null,t:0,raf:0,kind:'patient',base:72,spo:98,hp:6,max:6,prev:null,cells:[],ro:null};

  MON.cv=$('#monc');MON.ctx=MON.cv.getContext('2d');monResize();
  if(window.ResizeObserver&&!MON.ro){MON.ro=new ResizeObserver(monResize);MON.ro.observe(MON.cv)}
  if(!MON.raf)MON.raf=requestAnimationFrame(monTick);
}
function monResize(){
  if(!MON.cv)return;const r=MON.cv.getBoundingClientRect();const dpr=Math.min(2,window.devicePixelRatio||1);
  MON.w=Math.max(10,r.width);MON.h=Math.max(10,r.height);MON.cv.width=Math.round(MON.w*dpr);MON.cv.height=Math.round(MON.h*dpr);
  MON.ctx.setTransform(dpr,0,0,dpr,0,0);const bm=$('#bmap');MON.x0=bm&&bm.firstElementChild?Math.max(0,bm.getBoundingClientRect().right-r.left+6):0;MON.x=MON.x0;MON.ly=null;MON.ctx.clearRect(0,0,MON.w,MON.h);
}
function monSet(c){
  const w=c.who,newCase=MON.id!==c.id;MON.id=c.id;MON.kind=w.kind;MON.base=w.hr||72;MON.spo=w.spo2||98;MON.max=S.cfg.hp;MON.hp=S.cs.hp;
  if(newCase){MON.cells=[];const r=rng(hash(c.id+'cells'));for(let i=0;i<26;i++)MON.cells.push({a:r()*Math.PI*2,d:Math.sqrt(r())*.82,r:.06+r()*.035,s:(r()-.5)*.25,ph:r()*6});if(MON.ctx)monResize()}
  const mon=$('#mon');mon.classList.toggle('alarm',MON.kind==='patient'&&MON.hp===1);mon.classList.toggle('flat',MON.kind==='patient'&&MON.hp<=0);
  monRead();
}
function hrNow(){const lost=MON.max-MON.hp;return MON.base>=60?MON.base+lost*7:Math.max(34,MON.base-lost*3)}
function monRead(beat){
  const el=$('#monread');if(!el)return;
  if(MON.kind==='culture'){const v=Math.round(100*MON.hp/MON.max);el.innerHTML=`<div class="m-hr" style="--mc:${v>50?'#3DF59B':v>20?'#FFB547':'#FF3E7A'}">${v}<small>%</small></div><div class="m-sub">живых клеток</div>`;return}
  if(MON.hp<=0){el.innerHTML=`<div class="m-hr">0<small>уд/мин</small></div><div class="m-sub"><b>---</b> SpO₂</div>`;return}
  const hr=Math.round(hrNow()+(beat?(Math.random()*4-2):0)),sp=Math.max(72,Math.round(MON.spo-(MON.max-MON.hp)*1.6));
  const col=MON.hp<=2?'#FF3E7A':MON.hp<=Math.ceil(MON.max/2)?'#FFB547':'#3DF59B';
  el.innerHTML=`<div class="m-hr" style="--mc:${col}"><span class="heart ${beat?'beat':''}">♥</span> ${hr}<small>уд/мин</small></div><div class="m-sub"><b>${sp}%</b> SpO₂</div>`;
  if(beat)setTimeout(()=>{const h=el.querySelector('.heart');if(h)h.classList.remove('beat')},110);
}
function ecgv(ph){const g=(c,w,a)=>a*Math.exp(-((ph-c)**2)/(2*w*w));return g(.17,.024,.12)-g(.305,.008,.12)+g(.33,.0095,1)-g(.355,.009,.26)+g(.58,.042,.28)}
function monTick(t){
  MON.raf=requestAnimationFrame(monTick);
  const dt=Math.min(.05,(t-(MON.last||t))/1000);MON.last=t;
  if(!MON.cv||!MON.cv.isConnected||document.hidden||!inStage()||MON.frozen)return;
  if(MON.h<40||MON.w<60){monResize();if(MON.h<40||MON.w<60)return}
  const ctx=MON.ctx,W=MON.w,H=MON.h;
  if(MON.kind==='culture'){dish(ctx,W,H,dt);return}
  const flat=MON.hp<=0,period=60/hrNow(),speed=W/3.4;
  const col=flat||MON.hp<=2?'#FF3E7A':MON.hp<=Math.ceil(MON.max/2)?'#FFB547':'#3DF59B';
  ctx.lineWidth=2.4;ctx.strokeStyle=col;ctx.shadowColor=col;ctx.shadowBlur=10;ctx.lineCap='round';ctx.lineJoin='round';
  const steps=Math.max(1,Math.ceil(speed*dt/2));
  ctx.beginPath();if(MON.ly!=null)ctx.moveTo(MON.lx,MON.ly);
  for(let s=0;s<steps;s++){
    MON.t+=dt/steps;const ph=(MON.t%period)/period;
    let v=flat?0:ecgv(ph);if(!flat&&MON.hp===1)v+=(Math.random()-.5)*.07;
    if(!flat&&MON.prev!=null&&MON.prev<.33&&ph>=.33)monRead(true);MON.prev=ph;
    const y=H*.56-v*H*.34;MON.x+=speed*dt/steps;
    if(MON.x>W){ctx.stroke();MON.x=MON.x0||0;MON.ly=null;ctx.beginPath()}
    ctx.clearRect(Math.max(MON.x0||0,MON.x-1),0,20,H);
    if(MON.ly==null)ctx.moveTo(MON.x,y);else ctx.lineTo(MON.x,y);
    MON.lx=MON.x;MON.ly=y;
  }
  ctx.stroke();
}
function dish(ctx,W,H,dt){
  ctx.clearRect(0,0,W,H);ctx.shadowBlur=0;
  const R=Math.min(H*.42,W*.26),cx=R+W*.08,cy=H*.54;
  ctx.strokeStyle='rgba(127,214,255,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='rgba(127,214,255,.18)';ctx.beginPath();ctx.arc(cx,cy,R-6,0,Math.PI*2);ctx.stroke();
  const alive=Math.round(MON.cells.length*MON.hp/MON.max);
  MON.cells.forEach((c,i)=>{c.a+=c.s*dt*.4;c.ph+=dt;const live=i<alive;const x=cx+Math.cos(c.a)*c.d*R*.9,y=cy+Math.sin(c.a)*c.d*R*.9,r=c.r*R*(live?1+.06*Math.sin(c.ph*2):.7);
    ctx.fillStyle=live?'rgba(61,245,155,.22)':'rgba(120,130,150,.18)';ctx.strokeStyle=live?'#3DF59B':'#55606F';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle=live?'#3DF59B':'#55606F';ctx.beginPath();ctx.arc(x+r*.15,y-r*.1,r*.32,0,Math.PI*2);ctx.fill()});
}
function monHit(){const m=$('#mon');if(!m)return;m.classList.remove('hit');void m.offsetWidth;m.classList.add('hit')}

const HERO={raf:0,last:0};
function heroTick(t){
  HERO.raf=requestAnimationFrame(heroTick);const cv=$('#heroc');if(!cv||document.hidden)return;
  const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  if(cv.width!==Math.round(r.width*dpr)){cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr)}
  const ctx=cv.getContext('2d'),W=r.width,H=r.height;ctx.setTransform(dpr,0,0,dpr,0,0);
  if(UI.look==='code'){heroJanus(ctx,W,H,t);return}
  HP.cols=null;ctx.clearRect(0,0,W,H);
  const tt=t/1000,head=(tt*.22)%1.25,base=H*.36,amp=H*.24,css=getComputedStyle(document.documentElement);
  const sig=css.getPropertyValue('--alarm').trim()||'#FF3E7A';
  ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';
  for(let pass=0;pass<2;pass++){
    ctx.beginPath();
    for(let x=0;x<=W;x+=2){const f=x/W;const ph=(f*4.2)%1;const y=base-ecgv(ph)*amp;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
    if(pass===0){ctx.strokeStyle=sig;ctx.globalAlpha=.16;ctx.shadowBlur=0;ctx.stroke()}
    else{const g=ctx.createLinearGradient((head-.35)*W,0,head*W,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,sig);ctx.strokeStyle=g;ctx.globalAlpha=1;ctx.shadowColor=sig;ctx.shadowBlur=14;ctx.stroke()}
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}

function doGuess(n){

  const ok=n===c.T;cs.guesses.push({team,n,ok,op:cs.opened.length,hp:cs.hp});cs.ev.push({k:'g',n,team,ok});
  if(cs.coop){
    if(ok){cs.diag={team:-1,pts:3,n,coop:true};[0,1,2].forEach(t=>{addScore(t,3);cs.pts[t]+=3});splash('good','ПАЦИЕНТ СПАСЁН','Код синий · каждому штабу +3');burst();toTreat();return}

}

const MECH={t:[],svg:null};

function mechLevels(G){
  const act=G.E.filter(e=>e.t!=='inh'),ids=Object.keys(G.N),inc={},out={};act.forEach(e=>{inc[e.b]=1;out[e.a]=1});
  const L={};ids.forEach(id=>{if(!inc[id]&&(out[id]||!G.E.some(e=>e.a===id)))L[id]=0});
  for(let it=0;it<=ids.length;it++){let ch=false;for(const e of act){if(L[e.a]!=null&&(L[e.b]==null||L[e.b]<L[e.a]+1)&&L[e.a]<ids.length){L[e.b]=L[e.a]+1;ch=true}}if(!ch)break}
  G.E.filter(e=>e.t==='inh').forEach(e=>{if(L[e.a]==null)L[e.a]=Math.max(0,(L[e.b]||0)-1)});
  ids.forEach(id=>{if(L[id]==null)L[id]=0});return L;

function comet(svg,e,cls,dur){

    const a=el.animate([{transform:`translate(${e.x1}px,${e.y1}px)`,opacity:0},{opacity:1,offset:.12},{transform:`translate(${e.x1+dx*f}px,${e.y1+dy*f}px)`,opacity:fade?0:1}],{duration:dur*(fade?.75:1),delay,easing:'cubic-bezier(.45,0,.3,1)',fill:'both'});
    a.onfinish=()=>el.remove()};

    if(row!==c.r){c.r=row;ctx.fillStyle=col;ctx.globalAlpha=.85;ctx.fillText(c.c,x,y-fs);c.c=rg();ctx.fillStyle=head;ctx.globalAlpha=1;ctx.fillText(c.c,x,y)}

function decodeText(el,ms){if(!el)return;const fin=el.textContent,ch=[...fin],t0=performance.now();

/* Янус-киназа: два «лица» одной молекулы JAK2.
   JH2 — псевдокиназа, «сдерживающее» лицо (глаз закрыт); JH1 — настоящая киназа, «действующее» лицо (глаз открыт, летят фосфаты).
   Раз в несколько секунд — сбой V617F: трещина в JH2, сдержка падает, JH1 фосфорилирует без остановки. */
const JPROF=[[0,0],[.1,.005],[.19,.03],[.26,.08],[.30,.15],[.315,.21],[.298,.236],[.316,.27],[.36,.335],[.346,.355],[.316,.366],[.326,.394],[.31,.41],[.322,.43],[.305,.455],[.30,.49],[.275,.515],[.22,.53],[.17,.545],[.16,.62],[.17,.70],[.30,.76],[.40,.82],[.42,.90],[0,.90]];

function janusSVG(){const S=60,ox=50,oy=4,pt=janusPts().map(([x,y])=>`${(ox+x*S*1.5).toFixed(1)},${(oy+y*S*1.2).toFixed(1)}`).join(' ');
  const ex=(x,y)=>[(ox+x*S*1.5).toFixed(1),(oy+y*S*1.2).toFixed(1)];const [r1x,r1y]=ex(.255,.25),[l1x,l1y]=ex(-.255,.25),[mx,my]=ex(.33,.41);
  return `<svg class="jns" viewBox="0 0 100 74" aria-hidden="true"><polygon class="jo" points="${pt}"/><line class="jd" x1="${ox}" y1="${oy+2}" x2="${ox}" y2="${oy+.9*S*1.2}"/>`+
    `<circle class="je1" cx="${r1x}" cy="${r1y}" r="2.6"/><line class="je2" x1="${(+l1x-3).toFixed(1)}" y1="${l1y}" x2="${(+l1x+3).toFixed(1)}" y2="${l1y}"/>`+
    `<text class="jp" x="${+mx+4}" y="${my}">P</text><text class="jp" x="${+mx+4}" y="${my}">P</text><text class="jp" x="${+mx+4}" y="${my}">P</text>`+'</svg>'}
const HP={cols:null,last:0,W:0,H:0,G:null};
function janusGeo(W,H){
  const s=Math.min(H*.78,W*.40/.94),cx=W-.47*s-28,top=(H-s*1.02)/2,P=(x,y)=>[cx+x*s,top+y*s];
  return {s,cx,top,P,body:janusPts().map(([x,y])=>P(x,y)),eyeR:P(.255,.25),eyeL:P(-.255,.25),mouth:P(.33,.41),

function heroJanus(ctx,W,H,t){
  if(t-HP.last<34)return;HP.last=t;if(RM&&HP.still&&HP.W===W&&HP.H===H)return;
  const fs=Math.max(11,Math.round(H/24));
  if(!HP.cols||HP.W!==W||HP.H!==H){HP.W=W;HP.H=H;HP.fs=fs;HP.cols=Array.from({length:Math.ceil(W/fs)},()=>({y:Math.random()*H/fs,v:.3+Math.random()*.6}));ctx.clearRect(0,0,W,H);HP.G=janusGeo(W,H);HP.cells=null;HP.sp=[]}
  const G=HP.G,css=getComputedStyle(document.documentElement),gv=v=>css.getPropertyValue(v).trim();
  const sig=gv('--signal')||'#5FD991',rain=gv('--rain')||'#3C9E68',head=gv('--rain-h')||'#D2F2DE',al=gv('--alarm')||'#FF6474',gold=gv('--gold')||'#F2C14E',ink2=gv('--ink-2')||'#AEBFB4';
  const tt=t/1000,cyc=tt%7,glitch=!RM&&cyc>5.6&&cyc<6.6;   /* V617F: ~1 с из каждых 7 */

  const poly=p=>{ctx.beginPath();p.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath()};
  ctx.globalAlpha=.03;ctx.fillStyle=sig;poly(G.body);ctx.fill();

  ctx.setLineDash([4,5]);ctx.beginPath();ctx.moveTo(G.cx,G.top+G.s*.02);ctx.lineTo(G.cx,G.top+G.s*.9);ctx.stroke();ctx.setLineDash([]);

  else{ctx.shadowBlur=0;ctx.strokeStyle=ink2;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(lx-er*1.6,ly);ctx.quadraticCurveTo(lx,ly+er*.9,lx+er*1.6,ly);ctx.stroke()}

    ctx.fillStyle=al;ctx.font=`700 ${Math.round(fs*.85)}px "JetBrains Mono",monospace`;ctx.textAlign='right';ctx.fillText('V617F',G.P(-.3,.6)[0],G.P(-.3,.6)[1]);ctx.textAlign='center'}

  HP.sp=HP.sp.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.a-=.035;if(p.a<=0||p.x>W)return false;ctx.globalAlpha=p.a;ctx.fillText('P',p.x,p.y);return true});
